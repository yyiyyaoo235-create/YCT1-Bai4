<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>🎮 Game ôn từ · 我家有几口人</title>
<style>
:root{
  --red:#FF7E94; --red-dark:#E8536F; --red-soft:#FFEEF1;
  --gold:#ACD9F7; --gold-dark:#2E86C1; --gold-soft:#EAF6FF;
  --jade:#6CC6AA; --jade-dark:#2F8A6E; --jade-soft:#E7F7F1;
  --navy:#6A46B8; --navy-soft:#F1ECFB;
  --paper:#FFFDF8; --paper-2:#FAF7FA; --ink:#353435; --ink-soft:#726F72; --line:#ECE6EC;
  --shadow:rgba(90,70,110,.13);
  --font-vn:'Times New Roman', Times, 'Noto Serif', serif;
  --font-zh:'KaiTi','STKaiti','楷体','Kaiti SC','BiauKai','Noto Sans SC',serif;
}
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; overflow:hidden; background:#2B1B66; font-family:var(--font-vn); }
.zh{ font-family:var(--font-zh); }

.rk-overlay{
  position:fixed; inset:0; z-index:100000; display:none; flex-direction:column;
  height:100vh; height:100dvh;
  background:linear-gradient(180deg,#2B1B66 0%,#4A2E9B 55%,#7A55C8 100%);
  color:#fff; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; overflow:hidden;
}
.rk-overlay.rk-on{ display:flex; }
.rk-overlay button{ font-family:var(--font-vn); cursor:pointer; }

/* bầu trời */
.rk-sky{ position:absolute; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
.rk-stars{ position:absolute; left:0; right:0; top:-600px; bottom:0; background-repeat:repeat; }
.rk-stars.s1{
  background-image:
    radial-gradient(2px 2px at 20px 30px,#fff,transparent 60%),
    radial-gradient(2px 2px at 90px 120px,#FFE27A,transparent 60%),
    radial-gradient(1.5px 1.5px at 160px 70px,#fff,transparent 60%),
    radial-gradient(2px 2px at 230px 190px,#ACD9F7,transparent 60%),
    radial-gradient(1.5px 1.5px at 300px 40px,#fff,transparent 60%),
    radial-gradient(2px 2px at 60px 250px,#fff,transparent 60%),
    radial-gradient(1.5px 1.5px at 340px 260px,#FFB3C0,transparent 60%);
  background-size:380px 300px;
  animation:rk-drift 38s linear infinite, rk-twinkle 3.2s ease-in-out infinite;
}
.rk-stars.s2{
  background-image:
    radial-gradient(3px 3px at 50px 80px,rgba(255,255,255,.9),transparent 60%),
    radial-gradient(2.5px 2.5px at 200px 20px,rgba(255,226,122,.9),transparent 60%),
    radial-gradient(3px 3px at 310px 170px,rgba(255,255,255,.9),transparent 60%),
    radial-gradient(2.5px 2.5px at 140px 230px,rgba(172,217,247,.9),transparent 60%);
  background-size:420px 340px;
  animation:rk-drift 22s linear infinite, rk-twinkle 2.4s ease-in-out infinite reverse;
}
.rk-planet{ position:absolute; font-size:clamp(40px,8vw,84px); opacity:.5; filter:drop-shadow(0 0 18px rgba(255,255,255,.35)); animation:rk-float 9s ease-in-out infinite; }
.rk-planet.p1{ left:4%; top:26%; }
.rk-planet.p2{ right:5%; top:48%; font-size:clamp(34px,6vw,64px); animation-duration:12s; animation-delay:-3s; }
.rk-planet.p3{ left:46%; top:10%; font-size:clamp(26px,4vw,44px); animation-duration:14s; animation-delay:-6s; opacity:.35; }

/* thanh trên */
.rk-bar{ position:relative; z-index:2; flex:0 0 auto; display:flex; align-items:center; gap:8px; padding:10px clamp(10px,3vw,28px) 4px; }
.rk-icon-btn{
  flex:0 0 auto; width:44px; height:44px; border-radius:50%;
  border:2px solid rgba(255,255,255,.45); background:rgba(255,255,255,.16); color:#fff;
  font-size:20px; line-height:1; display:inline-flex; align-items:center; justify-content:center;
  backdrop-filter:blur(4px); transition:transform .12s ease, background .12s ease;
}
.rk-icon-btn:hover{ background:rgba(255,255,255,.3); }
.rk-icon-btn:active{ transform:scale(.9); }
.rk-stage{ flex:1 1 auto; min-width:0; font-size:clamp(14px,2.2vw,22px); font-weight:700; color:#FFE27A; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-shadow:0 2px 0 rgba(0,0,0,.25); }
.rk-qnum{ flex:0 0 auto; font-size:clamp(14px,2vw,20px); font-weight:700; color:rgba(255,255,255,.85); }
.rk-hearts{ flex:0 0 auto; display:flex; gap:2px; font-size:clamp(16px,2.6vw,26px); line-height:1; }
.rk-heart{ display:inline-block; transition:filter .3s ease; }
.rk-heart.off{ filter:grayscale(1) brightness(.55); opacity:.7; }
.rk-heart.gain{ animation:rk-heal .9s ease both; }
.rk-heart.lose{ animation:rk-shake .5s ease both; }
.rk-score{
  flex:0 0 auto; padding:5px 14px; border-radius:999px; min-width:76px; text-align:center;
  background:linear-gradient(145deg,#FFE27A,#FFC83D); border:3px solid #fff;
  font-size:clamp(15px,2.4vw,24px); font-weight:700; color:#8A5A00;
  box-shadow:0 4px 0 #D99A00, 0 8px 18px rgba(0,0,0,.25);
}
.rk-score.rk-pop{ animation:rk-pop .45s ease; }

/* thanh phụ: đề bài + hồi tim + combo */
.rk-sub{ position:relative; z-index:2; flex:0 0 auto; display:flex; align-items:center; justify-content:center; gap:10px; padding:2px 12px 6px; flex-wrap:wrap; }
.rk-prompt{
  display:flex; align-items:center; gap:14px; padding:6px 26px; border-radius:28px;
  background:#fff; color:var(--ink); border:3px solid #FFE27A;
  font-size:clamp(16px,2.8vw,26px); font-weight:700; box-shadow:0 4px 0 #D9A400, 0 6px 16px rgba(0,0,0,.25);
}
.rk-prompt .pe{ font-size:1.7em; line-height:1; }
.rk-prompt .pz{ font-family:var(--font-zh); font-size:2.6em; line-height:1.05; color:#2B1B66; }
.rk-prompt .pv{ font-size:1.25em; color:var(--red-dark); line-height:1.1; }
.rk-prompt .pt{ display:block; font-size:.55em; color:var(--ink-soft); font-weight:700; line-height:1.2; }
.rk-prompt .pw{ display:flex; flex-direction:column; align-items:flex-start; }
.rk-prompt.cz{ flex-direction:column; align-items:center; gap:2px; max-width:96vw; padding:6px 18px 8px; text-align:center; }
.rk-prompt.cz .pz{ font-size:1.7em; line-height:1.2; }
.rk-prompt.cz .pp{ font-size:.8em; color:var(--red-dark); line-height:1.25; }
.rk-prompt.cz .pv{ font-size:.75em; color:var(--ink-soft); line-height:1.25; }
.rk-prompt.cz .pt{ font-size:.5em; margin-top:1px; }
.rk-prompt .blank{ display:inline-block; min-width:1.5em; border-bottom:4px solid var(--red-dark); color:var(--red-dark); line-height:.9; }
.rk-prompt.pop{ animation:rk-pop .45s ease; }
.rk-meter{ display:flex; align-items:center; gap:8px; padding:4px 12px; border-radius:999px; background:rgba(255,255,255,.14); border:2px solid rgba(255,255,255,.28); font-size:clamp(12px,1.8vw,15px); font-weight:700; color:#fff; }
.rk-pips{ display:flex; gap:5px; }
.rk-pip{ width:clamp(13px,2vw,18px); height:clamp(13px,2vw,18px); border-radius:50%; background:rgba(255,255,255,.2); border:2px solid rgba(255,255,255,.4); transition:background .2s ease, transform .2s ease, box-shadow .2s ease; }
.rk-pip.on{ background:radial-gradient(circle at 35% 30%,#FFB3C0,#FF5C7A); border-color:#fff; transform:scale(1.15); box-shadow:0 0 10px #FF7E94; }
.rk-meter.full .rk-pip{ animation:rk-pulse .45s ease 2; }
.rk-combo{ padding:4px 14px; border-radius:999px; font-size:clamp(14px,2.2vw,20px); font-weight:700; color:#fff; background:linear-gradient(145deg,#FF9A5C,#FF5C7A); border:2px solid #fff; box-shadow:0 0 16px rgba(255,126,148,.8); opacity:0; transform:scale(.6); transition:opacity .2s ease, transform .2s ease; }
.rk-combo.show{ opacity:1; transform:scale(1); }
.rk-combo.bump{ animation:rk-pop .4s ease; }

/* sân chơi */
.rk-field{ position:relative; z-index:1; flex:1 1 auto; min-height:0; overflow:hidden; }
.rk-answers,.rk-fx{ position:absolute; inset:0; }
.rk-fx{ pointer-events:none; z-index:5; }
.rk-zone{
  position:absolute; left:0; right:0; bottom:0; height:clamp(88px,16vh,140px);
  background:linear-gradient(to bottom,rgba(255,92,122,.5),rgba(255,92,122,.12));
  border-top:4px dashed #FF8FA3; pointer-events:none; z-index:1;
  box-shadow:0 -6px 24px rgba(255,92,122,.55); animation:rk-zonepulse 1.6s ease-in-out infinite;
}
.rk-zone span{ position:absolute; right:12px; top:4px; font-size:clamp(11px,1.6vw,14px); font-weight:700; color:#FFD1DA; }
.rk-rocket{ position:absolute; bottom:12px; left:50%; width:56px; height:56px; margin-left:-28px; z-index:4; display:flex; align-items:center; justify-content:center; pointer-events:none; transition:left .28s ease; }
.rk-rocket .rk-body{ display:block; font-size:46px; line-height:1; transform:rotate(var(--rk-rot,-45deg)); filter:drop-shadow(0 0 10px rgba(255,255,255,.6)); animation:rk-hover 1.4s ease-in-out infinite; }
.rk-rocket .rk-flame{ position:absolute; left:50%; bottom:-14px; width:16px; height:28px; margin-left:-8px; border-radius:50% 50% 50% 50%/30% 30% 70% 70%; background:linear-gradient(to bottom,#fff 0%,#FFE27A 35%,#FF9A5C 70%,rgba(255,92,122,0) 100%); transform-origin:top center; filter:blur(.6px); z-index:-1; animation:rk-flame .12s ease-in-out infinite alternate; }
.rk-rocket.fire .rk-body{ animation:rk-recoil .3s ease; }

/* thẻ đáp án rơi: chữ Hán + phiên âm + nghĩa */
.rk-ans{
  position:absolute; top:0; left:0; z-index:2; padding:0;
  border:3px solid var(--rk-bd); background:var(--rk-bg); border-radius:22px;
  box-shadow:0 6px 0 var(--rk-bd), 0 0 22px var(--rk-glow);
  color:var(--ink); touch-action:manipulation;
  transition:opacity .3s ease, filter .3s ease; will-change:transform;
}
.rk-ans-in{ display:block; padding:8px 6px 9px; text-align:center; line-height:1.15; animation:rk-sway 2.6s ease-in-out infinite; }
.rk-h{ display:block; font-family:var(--font-zh); font-size:2.1em; font-weight:700; line-height:1.1; white-space:nowrap; color:#2B1B66; }
.rk-p{ display:block; font-size:1.05em; font-weight:700; white-space:nowrap; color:var(--red-dark); margin-bottom:1px; }
.rk-m{ display:block; font-size:.82em; font-weight:700; color:var(--ink-soft); margin-top:3px; }
.rk-ans.k-pm .rk-p{ font-size:1.55em; margin:0; }
.rk-ans.k-pm .rk-m{ font-size:1em; color:var(--ink); margin-top:4px; }
.rk-ans.k-pm .rk-ans-in{ padding:12px 6px 12px; }
.rk-ans.k-hp .rk-h{ font-size:2.4em; }
.rk-ans.k-hp .rk-p{ font-size:1.15em; margin:0 0 1px; }
.rk-ans.k-hp .rk-ans-in{ padding:10px 6px 11px; }
.rk-c0{ --rk-bg:#FFEEF1; --rk-bd:#FF7E94; --rk-glow:rgba(255,126,148,.55); }
.rk-c1{ --rk-bg:#EAF6FF; --rk-bd:#6DB8EA; --rk-glow:rgba(172,217,247,.6); }
.rk-c2{ --rk-bg:#E7F7F1; --rk-bd:#6CC6AA; --rk-glow:rgba(108,198,170,.55); }
.rk-c1 .rk-ans-in{ animation-delay:-.9s; } .rk-c2 .rk-ans-in{ animation-delay:-1.8s; }
.rk-ans.rk-gone{ opacity:0; filter:blur(3px); pointer-events:none; }
.rk-ans.rk-hit{ --rk-bg:#D8F5E5; --rk-bd:#2F8A6E; --rk-glow:rgba(108,198,170,.95); }
.rk-ans.rk-hit .rk-ans-in{ animation:rk-pop .5s ease; }
.rk-ans.rk-wrong{ --rk-bg:#FFE1E6; --rk-bd:#E8536F; --rk-glow:rgba(255,92,122,.9); }
.rk-ans.rk-wrong .rk-ans-in{ animation:rk-shake .45s ease; }
.rk-paused .rk-ans{ filter:blur(8px); }

/* hiệu ứng */
.rk-beam{ position:absolute; width:10px; margin-left:-5px; border-radius:5px; background:linear-gradient(to top,#FFC83D,#fff); box-shadow:0 0 16px #FFE27A,0 0 30px #FFC83D; transform-origin:bottom center; animation:rk-beam .4s ease-out forwards; }
.rk-beam.rk-bad{ background:linear-gradient(to top,#E8536F,#fff); box-shadow:0 0 16px #FF7E94; animation:rk-beam-bad .4s ease-out forwards; }
.rk-spark{ position:absolute; line-height:1; pointer-events:none; animation:rk-spark .8s ease-out forwards; }
.rk-ring{ position:absolute; width:30px; height:30px; margin:-15px 0 0 -15px; border-radius:50%; border:5px solid #FFE27A; animation:rk-ring .6s ease-out forwards; }
.rk-ring.rk-bad{ border-color:#FF7E94; }
.rk-float{ position:absolute; transform:translateX(-50%); text-align:center; white-space:nowrap; font-size:clamp(24px,4.4vw,42px); font-weight:700; color:#FFE27A; text-shadow:0 3px 0 rgba(0,0,0,.35),0 0 14px rgba(255,200,61,.9); animation:rk-float2 1.1s ease-out forwards; }
.rk-float small{ display:block; font-size:.5em; color:#fff; text-shadow:0 2px 0 rgba(0,0,0,.4); }
.rk-float.heal{ color:#FF9FB0; font-size:clamp(26px,5vw,48px); animation-duration:1.5s; }
.rk-flash{ position:absolute; inset:0; z-index:6; pointer-events:none; opacity:0; background:radial-gradient(circle at 50% 55%,rgba(255,92,122,0) 35%,rgba(255,60,90,.65) 100%); }
.rk-flash.go{ animation:rk-flash .55s ease-out; }
.rk-flash.heal{ background:radial-gradient(circle at 50% 55%,rgba(255,255,255,0) 35%,rgba(255,159,176,.55) 100%); }
.rk-field.rk-shake{ animation:rk-fshake .4s ease; }
.rk-rise{ position:absolute; font-size:clamp(22px,4vw,34px); pointer-events:none; animation:rk-rise 1.5s ease-out forwards; }
.rk-banner{ position:absolute; left:50%; top:10px; transform:translateX(-50%); z-index:8; max-width:94%; padding:8px 20px; border-radius:999px; background:#fff; border:3px solid #FF7E94; font-size:clamp(15px,2.4vw,24px); font-weight:700; color:#E8536F; text-align:center; box-shadow:0 6px 16px rgba(0,0,0,.25); opacity:0; pointer-events:none; transition:opacity .2s ease; }
.rk-banner.rk-show{ opacity:1; }

/* màn mở đầu chặng / kết quả */
.rk-cover{ display:none; position:absolute; inset:0; z-index:7; align-items:center; justify-content:center; padding:clamp(8px,2vh,24px) clamp(10px,3vw,40px); overflow-y:auto; }
.rk-cover.rk-on{ display:flex; }
.rk-card{ width:min(100%,720px); margin:auto; text-align:center; color:var(--ink); background:#fff; border:4px solid #fff; border-radius:30px; padding:clamp(16px,3vh,36px) clamp(16px,4vw,40px); box-shadow:0 16px 46px rgba(20,8,60,.45),0 0 0 6px rgba(255,255,255,.18); display:flex; flex-direction:column; align-items:center; gap:clamp(8px,1.4vh,14px); animation:rk-pop .5s ease both; }
.rk-card .rk-big{ font-size:clamp(54px,11vh,96px); line-height:1; animation:rk-bob 2s ease-in-out infinite; }
.rk-card h2{ margin:0; font-size:clamp(26px,5vw,44px); color:var(--rk-title,var(--navy)); line-height:1.2; }
.rk-card .rk-subt{ margin:0; font-size:clamp(15px,2.3vw,22px); color:var(--ink-soft); }
.rk-card ul{ margin:0; padding:0; list-style:none; font-size:clamp(14px,2.1vw,19px); color:var(--ink); display:flex; flex-direction:column; gap:6px; text-align:left; }
.rk-card li{ padding:6px 14px; border-radius:14px; background:var(--paper-2); border:2px solid var(--line); }
.rk-bonus{ padding:8px 18px; border-radius:999px; font-size:clamp(15px,2.3vw,22px); font-weight:700; color:#8A5A00; background:linear-gradient(145deg,#FFF1B8,#FFE27A); border:3px solid #FFC83D; animation:rk-pop .6s ease both; }
.rk-go{ border:none; border-radius:999px; padding:12px 34px; font-size:clamp(18px,2.6vw,26px); font-weight:700; color:#fff; background:linear-gradient(145deg,var(--jade),var(--jade-dark)); box-shadow:0 6px 0 #1F6B53,0 10px 20px var(--shadow); transition:transform .1s ease, box-shadow .1s ease; animation:rk-btnpulse 1.8s ease-in-out infinite; }
.rk-go:active{ transform:translateY(5px); box-shadow:0 1px 0 #1F6B53; }
.rk-go.rk-alt{ background:linear-gradient(145deg,var(--gold),var(--gold-dark)); box-shadow:0 6px 0 #1F6A99,0 10px 20px var(--shadow); animation:none; }
.rk-go.rk-alt:active{ box-shadow:0 1px 0 #1F6A99; }
.rk-stars-row{ font-size:clamp(46px,10vh,84px); letter-spacing:6px; line-height:1; }
.rk-on-s{ display:inline-block; filter:drop-shadow(0 4px 6px rgba(232,164,0,.45)); animation:rk-starin .7s ease both; }
.rk-off-s{ display:inline-block; opacity:.25; filter:grayscale(1); }
.rk-total{ font-size:clamp(28px,5vw,48px); font-weight:700; color:var(--gold-dark); }
.rk-facts{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
.rk-fact{ padding:5px 14px; border-radius:999px; font-size:clamp(13px,1.9vw,18px); font-weight:700; background:var(--navy-soft); color:var(--navy); border:2px solid #D9CCF3; }
.rk-review{ width:100%; display:flex; flex-direction:column; align-items:center; gap:8px; }
.rk-review-t{ font-size:clamp(14px,2vw,19px); font-weight:700; color:var(--ink-soft); }
.rk-chips{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
.rk-chip{ border:2px solid var(--gold); background:var(--gold-soft); color:var(--ink); border-radius:16px; padding:5px 12px; font-size:clamp(14px,2vw,18px); font-weight:700; line-height:1.2; text-align:center; }
.rk-chip:hover{ background:#fff; }
.rk-chip .ch{ display:block; font-family:var(--font-zh); font-size:1.7em; color:#2B1B66; }
.rk-chip .cp{ display:block; color:var(--red-dark); }
.rk-chip .cm{ display:block; font-size:.85em; color:var(--ink-soft); }
.rk-row{ display:flex; flex-wrap:wrap; gap:14px; justify-content:center; margin-top:4px; }
.rk-confetti{ position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:9; }
.rk-confetti i{ position:absolute; top:-5vh; width:11px; height:17px; border-radius:3px; opacity:.95; animation:rk-fall linear forwards; }
.rk-confirm{ display:none; position:absolute; inset:0; z-index:10; background:rgba(30,15,70,.6); align-items:center; justify-content:center; padding:20px; }
.rk-confirm.rk-on{ display:flex; }
.rk-confirm .rk-card{ width:min(100%,500px); }

@keyframes rk-pop{ 0%{transform:scale(.85);} 60%{transform:scale(1.12);} 100%{transform:scale(1);} }
@keyframes rk-bob{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }
@keyframes rk-shake{ 0%,100%{transform:translateX(0);} 20%{transform:translateX(-9px);} 40%{transform:translateX(9px);} 60%{transform:translateX(-6px);} 80%{transform:translateX(6px);} }
@keyframes rk-fshake{ 0%,100%{transform:translate(0,0);} 20%{transform:translate(-7px,3px);} 40%{transform:translate(7px,-3px);} 60%{transform:translate(-5px,2px);} 80%{transform:translate(5px,-2px);} }
@keyframes rk-heal{ 0%{transform:scale(.3);} 45%{transform:scale(1.7); filter:drop-shadow(0 0 12px #FF7E94);} 100%{transform:scale(1);} }
@keyframes rk-pulse{ 0%,100%{transform:scale(1.15);} 50%{transform:scale(1.55);} }
@keyframes rk-drift{ to{transform:translateY(600px);} }
@keyframes rk-twinkle{ 0%,100%{opacity:.55;} 50%{opacity:1;} }
@keyframes rk-float{ 0%,100%{transform:translateY(0) rotate(-4deg);} 50%{transform:translateY(-16px) rotate(4deg);} }
@keyframes rk-zonepulse{ 0%,100%{box-shadow:0 -6px 24px rgba(255,92,122,.4);} 50%{box-shadow:0 -6px 34px rgba(255,92,122,.8);} }
@keyframes rk-hover{ 0%,100%{transform:rotate(var(--rk-rot,-45deg)) translate(0,0);} 50%{transform:rotate(var(--rk-rot,-45deg)) translate(2px,-5px);} }
@keyframes rk-flame{ from{transform:scaleY(.8) scaleX(.9); opacity:.85;} to{transform:scaleY(1.25) scaleX(1.1); opacity:1;} }
@keyframes rk-recoil{ 0%{transform:rotate(var(--rk-rot,-45deg)) translate(0,0);} 30%{transform:rotate(var(--rk-rot,-45deg)) translate(3px,10px) scale(.92);} 100%{transform:rotate(var(--rk-rot,-45deg)) translate(0,0);} }
@keyframes rk-sway{ 0%,100%{transform:rotate(-2deg);} 50%{transform:rotate(2deg);} }
@keyframes rk-beam{ 0%{transform:scaleY(0); opacity:1;} 55%{transform:scaleY(1); opacity:1;} 100%{transform:scaleY(1); opacity:0;} }
@keyframes rk-beam-bad{ 0%{transform:scaleY(0); opacity:1;} 40%{transform:scaleY(1); opacity:1;} 100%{transform:scaleY(0); opacity:0;} }
@keyframes rk-spark{ 0%{transform:translate(-50%,-50%) scale(1) rotate(0); opacity:1;} 100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.3) rotate(260deg); opacity:0;} }
@keyframes rk-ring{ 0%{transform:scale(.3); opacity:1;} 100%{transform:scale(3.8); opacity:0;} }
@keyframes rk-float2{ 0%{transform:translate(-50%,0); opacity:1;} 100%{transform:translate(-50%,-80px); opacity:0;} }
@keyframes rk-flash{ 0%{opacity:1;} 100%{opacity:0;} }
@keyframes rk-rise{ 0%{transform:translateY(0) scale(.6); opacity:1;} 100%{transform:translateY(-140px) scale(1.2); opacity:0;} }
@keyframes rk-fall{ to{transform:translateY(112vh) rotate(720deg);} }
@keyframes rk-starin{ 0%{transform:scale(0) rotate(-120deg);} 70%{transform:scale(1.3) rotate(10deg);} 100%{transform:scale(1) rotate(0);} }
@keyframes rk-btnpulse{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.05);} }
@media (prefers-reduced-motion: reduce){
  .rk-stars,.rk-planet,.rk-zone,.rk-ans-in,.rk-rocket .rk-body,.rk-go,.rk-card .rk-big{ animation:none !important; }
  .rk-confetti{ display:none; }
}
@media (max-width:560px){
  .rk-bar{ gap:5px; }
  .rk-icon-btn{ width:38px; height:38px; font-size:17px; }
  .rk-score{ min-width:0; padding:4px 9px; }
}

/* ============================================================
   GAME 2 — SÚT BÓNG VÀO GÔN
============================================================ */
.gm-c2{ --gm-bg:var(--jade-soft); --gm-bd:var(--jade); }
body.fb-open{ overflow:hidden; }
.fb-overlay{
  display:none; position:fixed; inset:0; z-index:100000;
  height:100vh; height:100dvh; flex-direction:column;
  background:
    radial-gradient(900px 520px at 100% -10%, var(--jade-soft) 0%, transparent 60%),
    radial-gradient(800px 500px at -10% 110%, var(--gold-soft) 0%, transparent 55%),
    var(--paper);
  color:var(--ink);
  -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
  overflow:hidden;
}
.fb-overlay.fb-on{ display:flex; }
.fb-overlay button{ font-family:var(--font-vn); cursor:pointer; }

.fb-bar{ flex:0 0 auto; display:flex; align-items:center; gap:10px; padding:12px clamp(12px,3vw,28px) 6px; }
.fb-icon-btn{
  flex:0 0 auto; width:44px; height:44px; border-radius:50%;
  border:2px solid var(--line); background:#fff; font-size:20px; line-height:1;
  display:inline-flex; align-items:center; justify-content:center;
  transition:transform .12s ease, background .12s ease;
}
.fb-icon-btn:hover{ background:var(--jade-soft); }
.fb-icon-btn:active{ transform:scale(.92); }
.fb-stage{ flex:1 1 auto; min-width:0; font-size:clamp(15px,2.2vw,22px); font-weight:700; color:var(--navy); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.fb-qnum{ flex:0 0 auto; font-size:clamp(14px,2vw,20px); font-weight:700; color:var(--ink-soft); }
.fb-hearts{ flex:0 0 auto; display:flex; gap:3px; font-size:clamp(20px,3vw,30px); line-height:1; }
.fb-heart{ display:inline-block; transition:filter .3s ease; }
.fb-heart.off{ filter:grayscale(1) brightness(.7); opacity:.6; }
.fb-heart.gain{ animation:fb-heal .9s ease both; }
.fb-heart.lose{ animation:fb-shake .5s ease both; }
.fb-score{
  flex:0 0 auto; padding:5px 16px; border-radius:999px; min-width:84px; text-align:center;
  background:var(--gold-soft); border:2px solid var(--gold);
  font-size:clamp(16px,2.4vw,24px); font-weight:700; color:var(--gold-dark);
}
.fb-score.fb-pop{ animation:fb-pop .45s ease; }

.fb-sub{ flex:0 0 auto; display:flex; align-items:center; justify-content:center; gap:14px; padding:2px 14px 6px; flex-wrap:wrap; }
.fb-meter{
  display:flex; align-items:center; gap:8px; padding:5px 14px; border-radius:999px;
  background:#fff; border:2px solid var(--line);
  font-size:clamp(12px,1.8vw,16px); font-weight:700; color:var(--ink-soft);
}
.fb-pips{ display:flex; gap:5px; }
.fb-pip{
  width:clamp(14px,2.2vw,20px); height:clamp(14px,2.2vw,20px); border-radius:50%;
  background:var(--paper-2); border:2px solid var(--line);
  transition:background .2s ease, transform .2s ease, box-shadow .2s ease;
}
.fb-pip.on{ background:radial-gradient(circle at 35% 30%, #FFB3C0, #FF5C7A); border-color:#fff; transform:scale(1.15); box-shadow:0 0 8px #FF7E94; }
.fb-meter.full .fb-pip{ animation:fb-pulse .45s ease 2; }
.fb-combo{
  padding:5px 16px; border-radius:999px; font-size:clamp(14px,2.2vw,20px); font-weight:700; color:#fff;
  background:linear-gradient(145deg,#FF9A5C,#FF5C7A); border:2px solid #fff;
  box-shadow:0 4px 12px rgba(255,126,148,.5);
  opacity:0; transform:scale(.6); transition:opacity .2s ease, transform .2s ease;
}
.fb-combo.show{ opacity:1; transform:scale(1); }
.fb-combo.bump{ animation:fb-pop .4s ease; }

/* ---- sân cỏ ---- */
.fb-field{
  position:relative; flex:1 1 auto; min-height:0; overflow:hidden;
  background:repeating-linear-gradient(to bottom, #E3F6E9 0, #E3F6E9 64px, #D5F0DE 64px, #D5F0DE 128px);
  border-top:3px solid #BFE5CC;
}
.fb-field::before{
  content:""; position:absolute; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(ellipse at 50% 38%, rgba(255,255,255,.38) 0, rgba(255,255,255,0) 62%),
    radial-gradient(ellipse at 50% 120%, rgba(120,200,150,.28) 0, rgba(120,200,150,0) 60%);
}
.fb-part{
  position:absolute; left:50%; top:10px; transform:translateX(-50%); z-index:3; max-width:94%;
  padding:6px 18px; border-radius:999px; background:#fff; border:3px solid var(--jade);
  font-size:clamp(13px,2vw,20px); font-weight:700; color:var(--jade-dark); text-align:center;
  box-shadow:0 4px 12px var(--shadow); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.fb-goal{
  position:absolute; left:50%; top:clamp(14px,3vh,24px); transform:translateX(-50%);
  width:min(94%, 760px); height:clamp(150px,42%,300px);
  border:7px solid #fff; border-bottom:none; border-radius:14px 14px 0 0;
  background:
    repeating-linear-gradient(45deg, rgba(255,255,255,.55) 0 2px, transparent 2px 14px),
    repeating-linear-gradient(-45deg, rgba(255,255,255,.55) 0 2px, transparent 2px 14px),
    rgba(120,150,170,.18);
  box-shadow:0 8px 22px var(--shadow); z-index:1;
}
.fb-zones{
  position:absolute; inset:0; display:grid;
  grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:6px; padding:6px;
}
.fb-zone{
  position:relative; border:3px solid var(--fb-bd); background:var(--fb-bg);
  border-radius:16px; box-shadow:0 4px 0 var(--fb-bd); color:var(--ink);
  display:flex; align-items:center; justify-content:center; padding:2px 8px;
  touch-action:manipulation; transition:transform .1s ease, opacity .2s ease, box-shadow .1s ease;
}
.fb-zone:hover:not(.fb-off){ transform:translateY(-2px); }
.fb-zone:active:not(.fb-off){ transform:translateY(3px); box-shadow:0 1px 0 var(--fb-bd); }
.fb-zlabel{ font-family:var(--font-vn); font-weight:700; line-height:1.1; white-space:nowrap; }
.fb-zkey{
  position:absolute; left:8px; top:6px; width:22px; height:22px; border-radius:50%;
  background:#fff; border:2px solid var(--fb-bd); font-size:12px; font-weight:700; color:var(--ink-soft);
  display:inline-flex; align-items:center; justify-content:center;
}
.fb-z0{ --fb-bg:var(--red-soft); --fb-bd:var(--red); }
.fb-z1{ --fb-bg:var(--gold-soft); --fb-bd:var(--gold); }
.fb-z2{ --fb-bg:var(--jade-soft); --fb-bd:var(--jade); }
.fb-z3{ --fb-bg:var(--navy-soft); --fb-bd:#B7A3E3; }
.fb-zone.fb-off{ opacity:.3; pointer-events:none; box-shadow:none; }
.fb-zone.fb-hit{ --fb-bg:#D8F5E5; --fb-bd:var(--jade-dark); animation:fb-net .6s ease; }
.fb-keeper{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:2;
  font-size:clamp(34px,8vh,60px); line-height:1; pointer-events:none;
  opacity:0; transition:left .25s ease, opacity .2s ease;
}
.fb-keeper.show{ opacity:1; }

/* vạch kẻ sân (trang trí) */
.fb-lines{
  position:absolute; left:50%; top:clamp(14px,3vh,24px); transform:translateX(-50%);
  width:min(94%, 760px); height:clamp(150px,42%,300px); z-index:0; pointer-events:none;
  --ln:rgba(255,255,255,.95);
}
.fb-lines i{ position:absolute; display:block; box-sizing:border-box; }
.fb-ln-goal{ left:-100vw; width:300vw; top:100%; height:5px; margin-top:-2px; background:var(--ln); border-radius:3px; }
.fb-ln-pen{ left:-3%; width:106%; top:100%; height:92%; border:5px solid var(--ln); border-top:none; border-radius:0 0 10px 10px; }
.fb-ln-six{ left:20%; width:60%; top:100%; height:38%; border:5px solid var(--ln); border-top:none; border-radius:0 0 8px 8px; }
.fb-flag{ position:absolute; top:100%; margin-top:-26px; font-size:clamp(20px,4vh,30px); line-height:1; }
.fb-flag.l{ left:-9%; } .fb-flag.r{ right:-9%; }
.fb-ln-circle{
  position:absolute; left:50%; bottom:calc(-1 * clamp(40px,9vh,70px));
  width:clamp(160px,34vh,260px); height:clamp(160px,34vh,260px);
  margin-left:calc(clamp(160px,34vh,260px) / -2);
  border:5px solid rgba(255,255,255,.95); border-radius:50%; z-index:0; pointer-events:none;
}
.fb-ln-circle::after{ content:""; position:absolute; left:50%; top:50%; width:16px; height:16px; margin:-8px 0 0 -8px; border-radius:50%; background:rgba(255,255,255,.95); }

.fb-ball{
  position:absolute; left:50%; bottom:clamp(14px,6%,50px);
  width:clamp(52px,10vh,84px); height:clamp(52px,10vh,84px);
  margin-left:calc(clamp(52px,10vh,84px) / -2); z-index:5;
  display:flex; align-items:center; justify-content:center;
  font-size:clamp(46px,9vh,76px); line-height:1; pointer-events:none;
  transition:transform .55s cubic-bezier(.2,.75,.3,1);
  filter:drop-shadow(0 6px 4px rgba(60,90,70,.25));
}

/* hiệu ứng */
.fb-fx{ position:absolute; inset:0; pointer-events:none; z-index:6; }
.fb-spark{ position:absolute; line-height:1; pointer-events:none; animation:fb-spark .8s ease-out forwards; font-style:normal; }
.fb-ring{ position:absolute; width:30px; height:30px; margin:-15px 0 0 -15px; border-radius:50%; border:5px solid #FFC83D; animation:fb-ring .6s ease-out forwards; }
.fb-ring.fb-bad{ border-color:#FF7E94; }
.fb-float{
  position:absolute; transform:translateX(-50%); text-align:center; white-space:nowrap;
  font-size:clamp(24px,4.4vw,42px); font-weight:700; color:var(--jade-dark);
  text-shadow:0 2px 0 #fff, 0 0 12px rgba(255,255,255,.9);
  animation:fb-float 1.1s ease-out forwards;
}
.fb-float small{ display:block; font-size:.5em; color:var(--gold-dark); text-shadow:0 1px 0 #fff; }
.fb-float.heal{ color:#E8536F; font-size:clamp(26px,5vw,48px); animation-duration:1.5s; }
.fb-rise{ position:absolute; font-size:clamp(22px,4vw,34px); pointer-events:none; animation:fb-rise 1.5s ease-out forwards; font-style:normal; }
.fb-banner{
  position:absolute; left:50%; bottom:12px; transform:translateX(-50%); z-index:8; max-width:92%;
  padding:8px 20px; border-radius:999px; background:#fff; border:3px solid var(--red);
  font-size:clamp(15px,2.4vw,24px); font-weight:700; color:var(--red-dark); text-align:center;
  box-shadow:0 6px 16px var(--shadow); opacity:0; pointer-events:none; transition:opacity .2s ease;
}
.fb-banner.fb-show{ opacity:1; }

/* màn giới thiệu chặng / kết quả */
.fb-cover{
  display:none; position:absolute; inset:0; z-index:9; align-items:center; justify-content:center;
  padding:clamp(8px,2vh,24px) clamp(12px,3vw,40px); overflow-y:auto;
  background:rgba(250,252,246,.86); -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px);
}
.fb-cover.fb-on{ display:flex; }
.fb-card{
  width:min(100%, 720px); margin:auto; text-align:center; color:var(--ink);
  background:#fff; border:3px solid var(--line); border-radius:28px;
  padding:clamp(18px,3.6vh,40px) clamp(18px,4vw,44px);
  box-shadow:0 14px 40px var(--shadow);
  display:flex; flex-direction:column; align-items:center; gap:clamp(8px,1.6vh,14px);
  animation:fb-pop .5s ease both;
}
.fb-card .fb-big{ font-size:clamp(54px,11vh,96px); line-height:1; }
.fb-card h2{ margin:0; font-size:clamp(26px,5vw,46px); color:var(--fb-title, var(--navy)); line-height:1.2; }
.fb-card .fb-subt{ margin:0; font-size:clamp(15px,2.3vw,23px); color:var(--ink-soft); }
.fb-card ul{ margin:0; padding:0; list-style:none; font-size:clamp(14px,2.1vw,20px); color:var(--ink); display:flex; flex-direction:column; gap:6px; text-align:left; }
.fb-card li{ padding:6px 14px; border-radius:14px; background:var(--paper-2); border:2px solid var(--line); }
.fb-bonus{
  padding:8px 18px; border-radius:999px; font-size:clamp(15px,2.3vw,22px); font-weight:700; color:#8A5A00;
  background:linear-gradient(145deg,#FFF1B8,#FFE27A); border:3px solid #FFC83D; animation:fb-pop .6s ease both;
}
.fb-go{
  border:none; border-radius:999px; padding:12px 34px; font-size:clamp(18px,2.6vw,26px); font-weight:700; color:#fff;
  background:linear-gradient(145deg, var(--jade), var(--jade-dark));
  box-shadow:0 6px 0 #1F6B53, 0 10px 20px var(--shadow);
  transition:transform .1s ease, box-shadow .1s ease;
}
.fb-go:active{ transform:translateY(5px); box-shadow:0 1px 0 #1F6B53; }
.fb-go.fb-alt{ background:linear-gradient(145deg, var(--gold), var(--gold-dark)); box-shadow:0 6px 0 #1F6A99, 0 10px 20px var(--shadow); }
.fb-go.fb-alt:active{ box-shadow:0 1px 0 #1F6A99; }
.fb-stars-row{ font-size:clamp(46px,10vh,84px); letter-spacing:6px; line-height:1; }
.fb-on-s{ display:inline-block; filter:drop-shadow(0 4px 6px rgba(232,164,0,.45)); animation:fb-starin .7s ease both; }
.fb-off-s{ display:inline-block; opacity:.25; filter:grayscale(1); }
.fb-total{ font-size:clamp(28px,5vw,50px); font-weight:700; color:var(--gold-dark); }
.fb-facts{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
.fb-fact{ padding:5px 14px; border-radius:999px; font-size:clamp(13px,1.9vw,18px); font-weight:700; background:var(--navy-soft); color:var(--navy); border:2px solid #D9CCF3; }
.fb-review{ width:100%; display:flex; flex-direction:column; align-items:center; gap:8px; }
.fb-review-t{ font-size:clamp(14px,2vw,20px); font-weight:700; color:var(--ink-soft); }
.fb-chips{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
.fb-chip{ border:2px solid var(--gold); background:var(--gold-soft); color:var(--ink); border-radius:999px; padding:6px 16px; font-size:clamp(17px,2.5vw,24px); font-weight:700; }
.fb-chip:hover{ background:#fff; }
.fb-chip::before{ content:"🔊 "; font-size:.8em; }
.fb-row{ display:flex; flex-wrap:wrap; gap:14px; justify-content:center; margin-top:4px; }
.fb-confetti{ position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:10; }
.fb-confetti i{ position:absolute; top:-5vh; width:11px; height:17px; border-radius:3px; opacity:.95; animation:fb-fall linear forwards; }

.fb-confirm{
  display:none; position:absolute; inset:0; z-index:12; background:rgba(53,52,53,.45);
  align-items:center; justify-content:center; padding:20px;
}
.fb-confirm.fb-on{ display:flex; }
.fb-confirm .fb-card{ width:min(100%, 500px); }
.fb-paused .fb-zones{ filter:blur(8px); }

@keyframes fb-pop{ 0%{ transform:scale(.85); } 60%{ transform:scale(1.12); } 100%{ transform:scale(1); } }
@keyframes fb-shake{ 0%,100%{ transform:translateX(0); } 20%{ transform:translateX(-9px); } 40%{ transform:translateX(9px); } 60%{ transform:translateX(-6px); } 80%{ transform:translateX(6px); } }
@keyframes fb-heal{ 0%{ transform:scale(.3); } 45%{ transform:scale(1.7); filter:drop-shadow(0 0 12px #FF7E94); } 100%{ transform:scale(1); } }
@keyframes fb-pulse{ 0%,100%{ transform:scale(1.15); } 50%{ transform:scale(1.55); } }
@keyframes fb-net{ 0%,100%{ transform:scale(1); } 25%{ transform:scale(1.07); } 50%{ transform:scale(.97); } 75%{ transform:scale(1.04); } }
@keyframes fb-spark{ 0%{ transform:translate(-50%,-50%) scale(1) rotate(0); opacity:1; } 100%{ transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.3) rotate(260deg); opacity:0; } }
@keyframes fb-ring{ 0%{ transform:scale(.3); opacity:1; } 100%{ transform:scale(3.8); opacity:0; } }
@keyframes fb-float{ 0%{ transform:translate(-50%,0); opacity:1; } 100%{ transform:translate(-50%,-80px); opacity:0; } }
@keyframes fb-rise{ 0%{ transform:translateY(0) scale(.6); opacity:1; } 100%{ transform:translateY(-140px) scale(1.2); opacity:0; } }
@keyframes fb-fall{ to{ transform:translateY(112vh) rotate(720deg); } }
@keyframes fb-starin{ 0%{ transform:scale(0) rotate(-120deg); } 70%{ transform:scale(1.3) rotate(10deg); } 100%{ transform:scale(1) rotate(0); } }
@media (prefers-reduced-motion: reduce){
  .fb-zone.fb-hit, .fb-score.fb-pop, .fb-on-s, .fb-card{ animation:none; }
  .fb-ball{ transition:none; }
  .fb-confetti{ display:none; }
}
@media (max-width:560px){
  .fb-bar{ gap:6px; }
  .fb-icon-btn{ width:38px; height:38px; font-size:17px; }
  .fb-score{ min-width:0; padding:4px 10px; }
  .fb-zkey{ display:none; }
}
@media (max-height:520px){
  .fb-goal, .fb-lines{ top:12px; height:130px; }
}



/* ============================================================
   MAP CHO GAME 1 (đổi nền, nhân vật bắn, hạt bay)
============================================================ */
.rk-overlay.rk-th-ocean{ background:linear-gradient(180deg,#0B3C73 0%,#126BA8 52%,#2FB3C9 100%); }

  background-image:
    radial-gradient(circle 7px at 40px 70px,rgba(255,255,255,.45),rgba(255,255,255,.12) 70%,transparent 72%),

.rk-overlay.rk-th-forest .rk-stars.s1{

.rk-overlay.rk-th-forest .rk-stars.s2{
  background-image:
    radial-gradient(4px 4px at 60px 90px,rgba(255,243,160,.9),transparent 70%),
    radial-gradient(3.5px 3.5px at 210px 30px,rgba(214,255,158,.9),transparent 70%),
    radial-gradient(4px 4px at 320px 190px,rgba(255,226,122,.9),transparent 70%);
  animation:rk-drift 28s linear infinite, rk-twinkle 1.8s ease-in-out infinite reverse;
}
.rk-overlay.rk-th-forest .rk-beam{ background:linear-gradient(to top,#9BE564,#fff); box-shadow:0 0 16px #D6FF9E,0 0 30px #6CBF6A; }

.rk-overlay.rk-th-candy{ background:linear-gradient(180deg,#B23A8C 0%,#E0609F 50%,#FF9FB8 100%); }
.rk-overlay.rk-th-candy .rk-stars.s1{
  background-image:
    radial-gradient(3px 3px at 30px 40px,#FFE27A,transparent 70%),
    radial-gradient(3px 3px at 120px 150px,#9FE8FF,transparent 70%),
    radial-gradient(3px 3px at 220px 80px,#fff,transparent 70%),
    radial-gradient(3px 3px at 310px 220px,#B8F5C8,transparent 70%),
    radial-gradient(3px 3px at 80px 260px,#D9C2FF,transparent 70%);
  animation:rk-drift 36s linear infinite, rk-twinkle 2.6s ease-in-out infinite;
}
.rk-overlay.rk-th-candy .rk-stars.s2{
  background-image:
    radial-gradient(4px 4px at 60px 90px,rgba(255,255,255,.9),transparent 70%),
    radial-gradient(4px 4px at 210px 30px,rgba(159,232,255,.9),transparent 70%),
    radial-gradient(4px 4px at 320px 190px,rgba(255,226,122,.9),transparent 70%);
  animation:rk-drift 24s linear infinite, rk-twinkle 2s ease-in-out infinite reverse;
}
.rk-overlay.rk-th-candy .rk-beam{ background:linear-gradient(to top,#FFD1E6,#fff); box-shadow:0 0 16px #fff,0 0 30px #FF9FB8; }

.rk-overlay.rk-th-ocean .rk-flame,.rk-overlay.rk-th-forest .rk-flame,.rk-overlay.rk-th-candy .rk-flame{ display:none; }
.rk-overlay.rk-th-ocean .rk-rocket .rk-body,.rk-overlay.rk-th-forest .rk-rocket .rk-body,.rk-overlay.rk-th-candy .rk-rocket .rk-body{ font-size:50px; }
.mp-back{ margin-top:16px; border:2px solid var(--line); background:#fff; color:var(--ink-soft); border-radius:999px; padding:8px 22px; font-family:var(--font-vn); font-size:clamp(14px,2vw,18px); font-weight:700; cursor:pointer; }
.mp-back:hover{ background:var(--paper-2); }

/* ---- CẢNH NỀN CHO TỪNG MAP ---- */
.rk-scene{ position:absolute; inset:0; pointer-events:none; overflow:hidden; }
.sc-it{ position:absolute; line-height:1; will-change:transform; }
.sc-flip,.sc-in{ display:block; }
.sc-in{ animation:sc-bob 3.2s ease-in-out infinite; }
.sc-swR{ left:0; animation:sc-swR linear infinite; }
.sc-swL{ left:0; animation:sc-swL linear infinite; }
.sc-flip{ transform:scaleX(-1); }
.sc-row{ opacity:.6; position:absolute; left:0; right:0; bottom:1%; display:flex; justify-content:space-around; align-items:flex-end; font-size:clamp(26px,5.5vh,50px); line-height:1; }
.sc-row span{ display:block; animation:sc-bob 4s ease-in-out infinite; }
.sc-row span:nth-child(2n){ animation-delay:-1.3s; } .sc-row span:nth-child(3n){ animation-delay:-2.4s; }
.sc-floor{ position:absolute; left:-6%; right:-6%; bottom:0; height:22%; }
.sc-floor.ocean{ background:linear-gradient(to bottom,rgba(232,211,160,0),#E6CF98 45%,#CDAE72); border-radius:50% 50% 0 0/28% 28% 0 0; }
.sc-floor.forest{ background:linear-gradient(to bottom,#3C9B4B,#1B5E2B); border-radius:50% 50% 0 0/45% 45% 0 0; }
.sc-floor.candy{ height:26%; background:
  radial-gradient(ellipse 42% 100% at 18% 100%,#FFB3D1 62%,transparent 63%),
  radial-gradient(ellipse 46% 88% at 66% 100%,#C8F0E0 62%,transparent 63%),
  radial-gradient(ellipse 36% 76% at 100% 100%,#FFE9A8 62%,transparent 63%); }
.sc-ray{ position:absolute; top:-10%; height:125%; background:linear-gradient(to bottom,rgba(255,255,255,.26),rgba(255,255,255,0)); transform:skewX(-18deg); animation:sc-sway 8s ease-in-out infinite; }
.sc-sun{ position:absolute; right:-10%; top:-14%; width:58vmin; height:58vmin; border-radius:50%; background:radial-gradient(circle,rgba(255,240,170,.62),rgba(255,240,170,0) 66%); animation:sc-glow 6s ease-in-out infinite; }
.sc-neb{ position:absolute; inset:0; background:
  radial-gradient(ellipse 50% 34% at 24% 30%,rgba(255,126,200,.26),transparent 70%),
  radial-gradient(ellipse 46% 40% at 80% 55%,rgba(100,170,255,.24),transparent 70%),
  radial-gradient(ellipse 40% 30% at 55% 86%,rgba(160,110,255,.3),transparent 70%); animation:sc-glow 9s ease-in-out infinite; }
.sc-shoot{ position:absolute; width:120px; height:3px; border-radius:3px; background:linear-gradient(90deg,rgba(255,255,255,0),#fff); opacity:0; animation:sc-shoot 8s ease-in infinite; }
.sc-fall{ top:-8%; animation:sc-fall linear infinite; }
@keyframes sc-bob{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-9px); } }
@keyframes sc-swR{ from{ transform:translateX(-25vw); } to{ transform:translateX(125vw); } }
@keyframes sc-swL{ from{ transform:translateX(125vw); } to{ transform:translateX(-25vw); } }
@keyframes sc-sway{ 0%,100%{ opacity:.25; transform:skewX(-18deg) translateX(0); } 50%{ opacity:.75; transform:skewX(-14deg) translateX(22px); } }
@keyframes sc-glow{ 0%,100%{ opacity:.7; } 50%{ opacity:1; } }
@keyframes sc-shoot{ 0%{ opacity:0; transform:translate(0,0) rotate(28deg); } 3%{ opacity:1; } 12%{ opacity:0; transform:translate(280px,150px) rotate(28deg); } 100%{ opacity:0; transform:translate(280px,150px) rotate(28deg); } }
@keyframes sc-fall{ 0%{ transform:translate(0,-10vh) rotate(0); } 50%{ transform:translate(34px,55vh) rotate(200deg); } 100%{ transform:translate(-22px,118vh) rotate(380deg); } }
@media (prefers-reduced-motion: reduce){ .rk-scene *{ animation:none !important; } }
.rk-overlay.rk-th-ocean .rk-beam{ width:16px; margin-left:-8px; border-radius:0; box-shadow:none; filter:drop-shadow(0 0 6px #7FE3F5);
  background:radial-gradient(circle at 50% 50%,#fff 0 3px,rgba(255,255,255,.55) 4px 6px,transparent 7px) 0 0/16px 18px repeat-y; }
.rk-overlay.rk-th-forest .rk-beam{ background:repeating-linear-gradient(to top,#9BE564 0 9px,#fff 9px 13px,#FFE27A 13px 22px); }
.rk-overlay.rk-th-candy .rk-beam{ background:repeating-linear-gradient(to top,#FF7E94 0 9px,#FFE27A 9px 18px,#9FE8FF 18px 27px,#fff 27px 31px); box-shadow:0 0 14px #fff; }
.rk-overlay.rk-th-ocean .rk-beam.rk-bad,.rk-overlay.rk-th-forest .rk-beam.rk-bad,.rk-overlay.rk-th-candy .rk-beam.rk-bad{ width:10px; margin-left:-5px; filter:none; background:linear-gradient(to top,#E8536F,#fff); box-shadow:0 0 16px #FF7E94; }

/* ---- GAME 2 · phần chỉnh riêng ---- */
.fb-overlay{ z-index:100000; }
.fb-overlay .rk-prompt{ box-shadow:0 4px 0 #D9A400, 0 6px 16px rgba(90,70,110,.2); }
.fb-sub{ gap:10px; }
.fb-zlabel{ display:flex; flex-direction:column; align-items:center; text-align:center; white-space:normal; line-height:1.1; }
.fz-h{ display:block; font-family:var(--font-zh); font-size:2.2em; font-weight:700; line-height:1.05; color:#2B1B66; white-space:nowrap; }
.fz-p{ display:block; font-size:1.1em; font-weight:700; line-height:1.2; color:var(--red-dark); white-space:nowrap; }
.fz-p.big{ font-size:1.7em; }
.fz-m{ display:block; font-size:.95em; font-weight:700; line-height:1.2; color:var(--ink-soft); white-space:nowrap; }
.fz-p .fz-v{ color:var(--ink-soft); }
.fb-chip{ border-radius:16px; padding:5px 12px; font-size:clamp(14px,2vw,18px); line-height:1.2; text-align:center; }
.fb-chip::before{ content:none; }
.fb-chip .ch{ display:block; font-family:var(--font-zh); font-size:1.7em; color:#2B1B66; }
.fb-chip .cp{ display:block; color:var(--red-dark); }
.fb-chip .cm{ display:block; font-size:.85em; color:var(--ink-soft); }

/* ============================================================
   GAME 3 — NGHIÊNG ĐẦU CHỌN ĐÁP ÁN (2 thẻ trái / phải · camera hoặc phím/chạm)
============================================================ */
.gm-c3{ --gm-bg:var(--gold-soft); --gm-bd:var(--gold); }
body.tl-open{ overflow:hidden; }
.tl-overlay{
  display:none; position:fixed; inset:0; z-index:100000;
  height:100vh; height:100dvh; flex-direction:column;
  background:
    radial-gradient(900px 520px at 100% -10%, var(--navy-soft) 0%, transparent 60%),
    radial-gradient(800px 500px at -10% 110%, var(--red-soft) 0%, transparent 55%),
    var(--paper);
  color:var(--ink);
  -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
  overflow:hidden;
}
.tl-overlay.tl-on{ display:flex; }
.tl-overlay button{ font-family:var(--font-vn); cursor:pointer; }
.tl-bar{ flex:0 0 auto; display:flex; align-items:center; gap:10px; padding:12px clamp(12px,3vw,28px) 6px; }
.tl-icon-btn{
  flex:0 0 auto; width:44px; height:44px; border-radius:50%;
  border:2px solid var(--line); background:#fff; font-size:20px; line-height:1;
  display:inline-flex; align-items:center; justify-content:center;
  transition:transform .12s ease, background .12s ease;
}
.tl-icon-btn:hover{ background:var(--navy-soft); }
.tl-icon-btn:active{ transform:scale(.92); }
.tl-stage{ flex:1 1 auto; min-width:0; font-size:clamp(15px,2.2vw,22px); font-weight:700; color:var(--navy); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tl-qnum{ flex:0 0 auto; font-size:clamp(14px,2vw,20px); font-weight:700; color:var(--ink-soft); }
.tl-hearts{ flex:0 0 auto; display:flex; gap:3px; font-size:clamp(20px,3vw,30px); line-height:1; }
.tl-heart{ display:inline-block; transition:filter .3s ease; }
.tl-heart.off{ filter:grayscale(1) brightness(.7); opacity:.6; }
.tl-heart.gain{ animation:tl-heal .9s ease both; }
.tl-heart.lose{ animation:tl-shake .5s ease both; }
.tl-score{
  flex:0 0 auto; padding:5px 16px; border-radius:999px; min-width:84px; text-align:center;
  background:var(--gold-soft); border:2px solid var(--gold);
  font-size:clamp(16px,2.4vw,24px); font-weight:700; color:var(--gold-dark);
}
.tl-score.tl-pop{ animation:tl-pop .45s ease; }
.tl-sub{ flex:0 0 auto; display:flex; align-items:center; justify-content:center; gap:10px; padding:2px 14px 6px; flex-wrap:wrap; }
.tl-overlay .rk-prompt{ box-shadow:0 4px 0 #D9A400, 0 6px 16px rgba(90,70,110,.2); }
.tl-meter{
  display:flex; align-items:center; gap:8px; padding:5px 14px; border-radius:999px;
  background:#fff; border:2px solid var(--line);
  font-size:clamp(12px,1.8vw,16px); font-weight:700; color:var(--ink-soft);
}
.tl-pips{ display:flex; gap:5px; }
.tl-pip{
  width:clamp(14px,2.2vw,20px); height:clamp(14px,2.2vw,20px); border-radius:50%;
  background:var(--paper-2); border:2px solid var(--line);
  transition:background .2s ease, transform .2s ease, box-shadow .2s ease;
}
.tl-pip.on{ background:radial-gradient(circle at 35% 30%, #FFB3C0, #FF5C7A); border-color:#fff; transform:scale(1.15); box-shadow:0 0 8px #FF7E94; }
.tl-meter.full .tl-pip{ animation:tl-pulse .45s ease 2; }
.tl-combo{
  padding:5px 16px; border-radius:999px; font-size:clamp(14px,2.2vw,20px); font-weight:700; color:#fff;
  background:linear-gradient(145deg,#FF9A5C,#FF5C7A); border:2px solid #fff;
  box-shadow:0 4px 12px rgba(255,126,148,.5);
  opacity:0; transform:scale(.6); transition:opacity .2s ease, transform .2s ease;
}
.tl-combo.show{ opacity:1; transform:scale(1); }
.tl-combo.bump{ animation:tl-pop .4s ease; }

/* ---- khu chơi: 2 thẻ trái / phải + cột giữa (camera hoặc gợi ý phím) ---- */
.tl-field{
  position:relative; flex:1 1 auto; min-height:0; overflow:hidden;
  background:linear-gradient(180deg, #F6F1FF 0%, #FFF3F6 100%);
  border-top:3px solid #E4DAF6;
}
.tl-board{
  position:absolute; left:clamp(8px,2vw,22px); right:clamp(8px,2vw,22px); top:clamp(10px,2vh,20px); bottom:clamp(8px,2vh,20px);
  display:grid; grid-template-columns:minmax(0,1fr) clamp(150px,20vw,280px) minmax(0,1fr);
  gap:clamp(8px,1.6vw,18px); z-index:1;
}
.tl-card{
  min-height:0; min-width:0; position:relative; border-radius:34px; padding:12px;
  border:7px solid var(--tl-bd); background:var(--tl-bg); box-shadow:0 7px 0 var(--tl-bd), 0 12px 24px var(--shadow);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center;
  touch-action:manipulation; transition:transform .15s ease, background .2s ease, border-color .2s ease, box-shadow .2s ease;
}
.tl-left{ --tl-bg:var(--red-soft); --tl-bd:var(--red); }
.tl-right{ --tl-bg:var(--navy-soft); --tl-bd:#B7A3E3; }
.tl-card:hover{ transform:translateY(-2px); }
.tl-hint{ position:absolute; top:6px; font-size:clamp(18px,3vw,28px); line-height:1; color:var(--ink-soft); opacity:.7; }
.tl-left .tl-hint{ left:14px; } .tl-right .tl-hint{ right:14px; }
.tl-zlabel{ display:flex; flex-direction:column; align-items:center; text-align:center; white-space:normal; line-height:1.1; max-width:100%; }
.tl-card.tl-lean{ transform:scale(1.04); border-color:var(--ink); }
.tl-card.tl-ok{ --tl-bg:#D8F5E5; --tl-bd:var(--jade-dark); animation:tl-pop .55s ease; }
.tl-card.tl-no{ --tl-bg:#FFD9DE; --tl-bd:#E5484D; animation:tl-shake .45s ease; }
.tl-mid{ min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; text-align:center; }
.tl-msg{ font-size:clamp(28px,5vw,52px); font-weight:700; line-height:1.2; min-height:1.2em; }
.tl-cambox{ display:none; flex-direction:column; align-items:center; gap:8px; }
.tl-cambox.on{ display:flex; }
.tl-vid{ width:min(100%,260px); aspect-ratio:4/3; border-radius:18px; overflow:hidden; background:#000; box-shadow:0 4px 12px rgba(0,0,0,.25); }
.tl-vid video{ width:100%; height:100%; object-fit:cover; transform:scaleX(-1); }
.tl-ang{ font-size:clamp(11px,1.5vw,14px); font-weight:700; color:var(--ink-soft); }
.tl-cal{ border:2px solid var(--line); background:#fff; border-radius:12px; padding:5px 12px; font-size:13px; font-weight:700; color:var(--ink); }
.tl-keyhint{ padding:8px 16px; border-radius:16px; background:#fff; border:2px solid var(--line); font-weight:700; font-size:clamp(14px,2vw,20px); color:var(--ink-soft); }
.tl-keyhint.off{ display:none; }

/* hiệu ứng */
.tl-fx{ position:absolute; inset:0; pointer-events:none; z-index:6; }
.tl-spark{ position:absolute; line-height:1; pointer-events:none; animation:tl-spark .8s ease-out forwards; font-style:normal; }
.tl-ring{ position:absolute; width:30px; height:30px; margin:-15px 0 0 -15px; border-radius:50%; border:5px solid #FFC83D; animation:tl-ring .6s ease-out forwards; }
.tl-ring.tl-bad{ border-color:#FF7E94; }
.tl-float{
  position:absolute; transform:translateX(-50%); text-align:center; white-space:nowrap;
  font-size:clamp(24px,4.4vw,42px); font-weight:700; color:var(--jade-dark);
  text-shadow:0 2px 0 #fff, 0 0 12px rgba(255,255,255,.9);
  animation:tl-float 1.1s ease-out forwards;
}
.tl-float small{ display:block; font-size:.5em; color:var(--gold-dark); text-shadow:0 1px 0 #fff; }
.tl-float.heal{ color:#E8536F; font-size:clamp(26px,5vw,48px); animation-duration:1.5s; }
.tl-rise{ position:absolute; font-size:clamp(22px,4vw,34px); pointer-events:none; animation:tl-rise 1.5s ease-out forwards; font-style:normal; }
.tl-banner{
  position:absolute; left:50%; bottom:12px; transform:translateX(-50%); z-index:8; max-width:92%;
  padding:8px 20px; border-radius:999px; background:#fff; border:3px solid var(--red);
  font-size:clamp(15px,2.4vw,24px); font-weight:700; color:var(--red-dark); text-align:center;
  box-shadow:0 6px 16px var(--shadow); opacity:0; pointer-events:none; transition:opacity .2s ease;
}
.tl-banner.tl-show{ opacity:1; }

/* màn giới thiệu chặng / kết quả */
.tl-cover{
  display:none; position:absolute; inset:0; z-index:9; align-items:center; justify-content:center;
  padding:clamp(8px,2vh,24px) clamp(12px,3vw,40px); overflow-y:auto;
  background:rgba(250,248,255,.88); -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px);
}
.tl-cover.tl-on{ display:flex; }
.tl-card2{
  width:min(100%, 720px); margin:auto; text-align:center; color:var(--ink);
  background:#fff; border:3px solid var(--line); border-radius:28px;
  padding:clamp(18px,3.6vh,40px) clamp(18px,4vw,44px);
  box-shadow:0 14px 40px var(--shadow);
  display:flex; flex-direction:column; align-items:center; gap:clamp(8px,1.6vh,14px);
  animation:tl-pop .5s ease both;
}
.tl-card2 .tl-big{ font-size:clamp(54px,11vh,96px); line-height:1; }
.tl-card2 h2{ margin:0; font-size:clamp(26px,5vw,46px); color:var(--tl-title, var(--navy)); line-height:1.2; }
.tl-card2 .tl-subt{ margin:0; font-size:clamp(15px,2.3vw,23px); color:var(--ink-soft); }
.tl-subt:empty{ display:none; }
.tl-bonus{
  padding:8px 18px; border-radius:999px; font-size:clamp(15px,2.3vw,22px); font-weight:700; color:#8A5A00;
  background:linear-gradient(145deg,#FFF1B8,#FFE27A); border:3px solid #FFC83D; animation:tl-pop .6s ease both;
}
.tl-go{
  border:none; border-radius:999px; padding:12px 30px; font-size:clamp(17px,2.4vw,24px); font-weight:700; color:#fff;
  background:linear-gradient(145deg, #8F73D6, #6A46B8);
  box-shadow:0 6px 0 #4B2F8C, 0 10px 20px var(--shadow);
  transition:transform .1s ease, box-shadow .1s ease;
}
.tl-go:active{ transform:translateY(5px); box-shadow:0 1px 0 #4B2F8C; }
.tl-go:disabled{ opacity:.55; cursor:wait; }
.tl-go.tl-alt{ background:linear-gradient(145deg, var(--gold), var(--gold-dark)); box-shadow:0 6px 0 #1F6A99, 0 10px 20px var(--shadow); }
.tl-go.tl-alt:active{ box-shadow:0 1px 0 #1F6A99; }
.tl-go-big{ font-size:clamp(20px,3.2vw,30px); padding:14px 36px; }
.tl-go-mini{ padding:8px 22px; font-size:clamp(20px,3vw,26px); }
.tl-status{ min-height:1.3em; font-size:clamp(12px,1.8vw,16px); font-weight:700; color:#C2410C; }
.tl-status:empty{ display:none; }
.tl-small{ font-size:clamp(12px,1.7vw,15px) !important; opacity:.85; }
.tl-stars-row{ font-size:clamp(46px,10vh,84px); letter-spacing:6px; line-height:1; }
.tl-on-s{ display:inline-block; filter:drop-shadow(0 4px 6px rgba(232,164,0,.45)); animation:tl-starin .7s ease both; }
.tl-off-s{ display:inline-block; opacity:.25; filter:grayscale(1); }
.tl-end-meta{ font-size:clamp(12px,1.7vw,15px); font-weight:700; color:var(--ink-soft); opacity:.85; }
.tl-review{ width:100%; display:flex; flex-direction:column; align-items:center; gap:8px; }
.tl-review-t{ font-size:clamp(14px,2vw,20px); font-weight:700; color:var(--ink-soft); }
.tl-chips{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
.tl-chip{ border:2px solid var(--gold); background:var(--gold-soft); color:var(--ink); border-radius:16px; padding:5px 12px; font-size:clamp(14px,2vw,18px); line-height:1.2; text-align:center; font-weight:700; }
.tl-chip:hover{ background:#fff; }
.tl-chip .ch{ display:block; font-family:var(--font-zh); font-size:1.7em; color:#2B1B66; }
.tl-chip .cp{ display:block; color:var(--red-dark); }
.tl-chip .cm{ display:block; font-size:.85em; color:var(--ink-soft); }
.tl-row{ display:flex; flex-wrap:wrap; gap:14px; justify-content:center; margin-top:4px; }
.tl-confetti{ position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:10; }
.tl-confetti i{ position:absolute; top:-5vh; width:11px; height:17px; border-radius:3px; opacity:.95; animation:tl-fall linear forwards; }
.tl-confirm{
  display:none; position:absolute; inset:0; z-index:12; background:rgba(53,52,53,.45);
  align-items:center; justify-content:center; padding:20px;
}
.tl-confirm.tl-on{ display:flex; }
.tl-confirm .tl-card2{ width:min(100%, 500px); }
.tl-paused .tl-board{ filter:blur(8px); }
#tl-pause,#tl-mute{ display:none; }
.tl-qnum{ display:flex; align-items:center; }
.tl-qnum .gd-prog{ background:#E6E0F5; border-color:#C9BDE8; }

@keyframes tl-pop{ 0%{ transform:scale(.85); } 60%{ transform:scale(1.08); } 100%{ transform:scale(1); } }
@keyframes tl-shake{ 0%,100%{ transform:translateX(0); } 20%{ transform:translateX(-9px); } 40%{ transform:translateX(9px); } 60%{ transform:translateX(-6px); } 80%{ transform:translateX(6px); } }
@keyframes tl-heal{ 0%{ transform:scale(.3); } 45%{ transform:scale(1.7); filter:drop-shadow(0 0 12px #FF7E94); } 100%{ transform:scale(1); } }
@keyframes tl-pulse{ 0%,100%{ transform:scale(1.15); } 50%{ transform:scale(1.55); } }
@keyframes tl-spark{ 0%{ transform:translate(-50%,-50%) scale(1) rotate(0); opacity:1; } 100%{ transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.3) rotate(260deg); opacity:0; } }

  function pick(){
    if(!("speechSynthesis" in window)) return;
    var vs = window.speechSynthesis.getVoices() || []; voice = null;
    for(var i = 0; i < vs.length; i++){
      var l = (vs[i].lang || "").replace("_", "-").toLowerCase();
      if(l === "zh-cn" || l === "cmn-cn" || l.indexOf("zh-cn") === 0){ voice = vs[i]; break; }
    }
    if(!voice){ for(var j = 0; j < vs.length; j++){ if((vs[j].lang || "").toLowerCase().indexOf("zh") === 0){ voice = vs[j]; break; } } }
  }
  if("speechSynthesis" in window){ pick(); if(window.speechSynthesis.addEventListener){ window.speechSynthesis.addEventListener("voiceschanged", pick); } }
  function stop(){
    token++;
    if(curAudio){ try{ curAudio.pause(); }catch(e){} curAudio = null; }
    if("speechSynthesis" in window){ try{ window.speechSynthesis.cancel(); }catch(e){} }
  }
  function speak(w, onDone){
    var my = ++token, fired = false;
    function fin(){ if(fired) return; fired = true; if(my === token && onDone) onDone(); }
    if(!("speechSynthesis" in window)){ fin(); return; }
    try{
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(w.h);
      u.lang = "zh-CN"; u.rate = 0.7; u.pitch = 1.1;
      if(voice){ u.voice = voice; }
      u.onend = fin; u.onerror = fin;
      window.speechSynthesis.speak(u);
      setTimeout(fin, 4500);
    }catch(e){ fin(); }
  }
  function play(w, onDone){
    stop();
    var a = new Audio(DIR + encodeURIComponent(w.py) + ".mp3");
    curAudio = a;
    var fired = false;
    function fin(){ if(fired) return; fired = true; if(onDone) onDone(); }
    a.addEventListener("ended", fin);
    a.addEventListener("error", function(){ if(curAudio !== a) return; curAudio = null; fired = true; speak(w, onDone); });
    var p = a.play();
    if(p && p.catch){ p.catch(function(err){
      if(curAudio !== a) return; curAudio = null;
      if(err && err.name === "NotAllowedError"){ fin(); } else { fired = true; speak(w, onDone); }
    }); }
  }
  return { play:play, speak:speak, stop:stop };
})();

var pending = [];
var heartFx = null, meterFull = false, meterT = 0, stageBonus = 0, finalBonus = 0;

function shuffle(a){
  a = a.slice();
  for(var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function stageOf(i){
  for(var s = 0; s < STAGES.length; s++){ if(i >= STAGES[s].from && i <= STAGES[s].to) return s; }
  return STAGES.length - 1;
}
function later(fn, ms){
  var my = epoch;
  setTimeout(function(){
    if(my !== epoch || !active) return;
    if(paused){ pending.push({ e:my, f:fn }); } else { fn(); }
  }, ms);
}

function loadBest(){ try{ return parseInt(localStorage.getItem(BEST_KEY), 10) || 0; }catch(e){ return 0; } }
function saveBest(n){ try{ localStorage.setItem(BEST_KEY, String(n)); }catch(e){} }

// ---------- âm báo WebAudio ----------
var ac = null;
function getCtx(){
  if(!ac){ var C = window.AudioContext || window.webkitAudioContext; if(C){ try{ ac = new C(); }catch(e){} } }
  if(ac && ac.state === "suspended" && ac.resume){ ac.resume(); }
  return ac;
}
function tone(freq, start, dur, type, vol, endFreq){
  if(muted) return;
  var c = getCtx(); if(!c) return;
  var t0 = c.currentTime + start;
  var o = c.createOscillator(), g = c.createGain();
  o.type = type || "sine";
  o.frequency.setValueAtTime(freq, t0);
  if(endFreq){ o.frequency.exponentialRampToValueAtTime(endFreq, t0 + dur); }
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol || 0.2, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
function sfxPew(){
  var id = (window.RK_THEME || "space");
  if(id === "ocean"){ tone(260, 0, .16, "sine", .22, 760); tone(520, .07, .12, "sine", .12, 1100); }
  else if(id === "forest"){ tone(1300, 0, .08, "triangle", .16, 1900); tone(1700, .09, .09, "triangle", .14, 2300); }
  else if(id === "candy"){ tone(1047, 0, .07, "sine", .16); tone(1319, .06, .07, "sine", .16); tone(1568, .12, .1, "sine", .14); }
  else { tone(1100, 0, .18, "square", .10, 300); tone(420, 0, .12, "sawtooth", .05, 180); }
}
function sfxOk(){ tone(659, 0, .12); tone(880, .09, .12); tone(1319, .18, .3); }
function sfxNo(){ tone(220, 0, .34, "triangle", .30, 110); }
function sfxCombo(n){ var b = 880 + Math.min(n, 6) * 60; tone(b, .28, .1, "sine", .16); tone(b * 1.5, .36, .18, "sine", .16); }
function sfxHeal(){ [523,659,784,1047,1319,1568].forEach(function(f, i){ tone(f, i * .08, .22, "sine", .22); }); }
function sfxStage(){ [523,659,784,1047].forEach(function(f, i){ tone(f, i * .1, .2, "triangle", .22); }); }
function sfxWin(){ [523,659,784,1047,1319].forEach(function(f, i){ tone(f, i * .12, .26, "sine", .24); }); tone(1568, .66, .5, "sine", .2); }
function sfxLose(){ [392,330,262,196].forEach(function(f, i){ tone(f, i * .22, .3, "triangle", .26); }); }

// ---------- phát âm từ: file mp3 (nếu có) → không có thì giọng máy tiếng Trung ----------
var AUDIO_DIR = "audio/";
var curAudio = null, ttsToken = 0, zhVoice = null;
function pickVoice(){
  if(!("speechSynthesis" in window)) return;
  var vs = window.speechSynthesis.getVoices() || [];
  zhVoice = null;
  for(var i = 0; i < vs.length; i++){
    var l = (vs[i].lang || "").replace("_", "-").toLowerCase();
    if(l === "zh-cn" || l === "cmn-cn" || l.indexOf("zh-cn") === 0){ zhVoice = vs[i]; break; }
  }
  if(!zhVoice){
    for(var j = 0; j < vs.length; j++){
      if((vs[j].lang || "").toLowerCase().indexOf("zh") === 0){ zhVoice = vs[j]; break; }
    }
  }
}
if("speechSynthesis" in window){
  pickVoice();
  if(window.speechSynthesis.addEventListener){ window.speechSynthesis.addEventListener("voiceschanged", pickVoice); }
}
function stopAudio(){
  ttsToken++;
  if(curAudio){ try{ curAudio.pause(); }catch(e){} curAudio = null; }
  if("speechSynthesis" in window){ try{ window.speechSynthesis.cancel(); }catch(e){} }
}
function speak(w, onDone){
  var my = ++ttsToken, fired = false;
  function fin(){ if(fired) return; fired = true; if(my === ttsToken && onDone) onDone(); }
  if(!("speechSynthesis" in window)){ banner("Máy chưa có giọng đọc, bé xem chữ nhé!", 3000); fin(); return; }
  try{
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(w.h);
    u.lang = "zh-CN"; u.rate = 0.7; u.pitch = 1.1;
    if(zhVoice){ u.voice = zhVoice; }
    u.onend = fin; u.onerror = fin;
    window.speechSynthesis.speak(u);
    setTimeout(fin, 3500);   // phòng khi máy không báo kết thúc
  }catch(e){ fin(); }
}
function playWord(w, onDone){
  stopAudio();
  var my = ttsToken;
  var a = new Audio(AUDIO_DIR + encodeURIComponent(w.py) + ".mp3");
  curAudio = a;
  var fired = false;
  function fin(){ if(fired) return; fired = true; if(onDone) onDone(); }
  a.addEventListener("ended", fin);
  a.addEventListener("error", function(){ if(curAudio !== a) return; curAudio = null; speak(w, onDone); fired = true; });
  var p = a.play();
  if(p && p.catch){ p.catch(function(err){
    if(curAudio !== a) return;
    curAudio = null;
    if(err && err.name === "NotAllowedError"){ fin(); } else { fired = true; speak(w, onDone); }
  }); }
}

function banner(text, ms){
  bannerEl.textContent = text;
  bannerEl.classList.add("rk-show");
  clearTimeout(bannerT);
  if(ms){ bannerT = setTimeout(function(){ bannerEl.classList.remove("rk-show"); }, ms); }
}
function hideBanner(){ clearTimeout(bannerT); bannerEl.classList.remove("rk-show"); }

// ---------- thanh trên ----------
function updateBar(){
  var st = STAGES[stageIdx];
  stageEl.textContent = st.emoji;
  qnumEl.innerHTML = screen === "q" ? window.GD_PROG(idx, Q.length) : "";
  var h = "";
  for(var i = 0; i < MAXLIVES; i++){
    var cls = "rk-heart" + (i < lives ? "" : " off") + (heartFx && heartFx.i === i ? " " + heartFx.t : "");
    h += '<span class="' + cls + '">❤️</span>';
  }
  heartsEl.innerHTML = h;
  heartFx = null;
  scoreEl.textContent = "⭐ " + score;
  var on = meterFull ? HEAL_EVERY : (streak % HEAL_EVERY);
  for(var p = 0; p < pipEls.length; p++){ pipEls[p].classList.toggle("on", p < on); }
  meterEl.classList.toggle("full", meterFull);
  meterTxt.textContent = lives < MAXLIVES ? "❤️" : "💎";
  if(streak >= 2){ comboEl.textContent = "🔥 x" + streak; comboEl.classList.add("show"); }
  else { comboEl.classList.remove("show"); }
}
function popScore(){ scoreEl.classList.remove("rk-pop"); void scoreEl.offsetWidth; scoreEl.classList.add("rk-pop"); }
function bumpCombo(){ comboEl.classList.remove("bump"); void comboEl.offsetWidth; comboEl.classList.add("bump"); }

function showPrompt(q){
  var w = W[q.w];
  promptEl.style.display = "flex";
  promptEl.classList.toggle("cz", q.dir === "C");
  if(q.dir === "C"){
    var S = SENT[q.s];
    var zh = S.zh.replace("＿＿", '<span class="blank">＿＿</span>');
    var py = S.py.replace("___", '<span class="blank">___</span>');
    promptEl.innerHTML = '<span class="pp">' + py + '</span><span class="pz">' + zh + '</span><span class="pv">' + S.vn + '</span>';
  } else if(q.dir === "H"){
    promptEl.innerHTML = '<span class="pz">' + w.h + '</span><span class="pw"><span class="pv">Chữ này là gì?</span></span>';
  } else {
    promptEl.innerHTML = '<span class="pe">' + w.em + '</span><span class="pw"><span class="pv">' + w.vn + '</span></span>';
  }
  promptEl.classList.remove("pop"); void promptEl.offsetWidth; promptEl.classList.add("pop");
}
function hidePrompt(){ promptEl.style.display = "none"; promptEl.innerHTML = ""; }

// ---------- hình học ----------
function measure(){
  Wd = fieldEl.clientWidth; H = fieldEl.clientHeight;
  redY = H - zoneEl.offsetHeight;
}
function cardFont(w){
  var fsMax = Math.min(24, Math.max(13, H * 0.042));
  return Math.max(12, Math.min(fsMax, (w - 18) / 8));
}
function layout(){
  measure();
  var colW = Wd / 3, hmax = 0;
  answers.forEach(function(a){
    var w = Math.min(colW - 16, 230);
    a.w = w; a.el.style.width = w + "px";
    a.inn.style.fontSize = cardFont(w) + "px";
    a.h = a.el.offsetHeight;
    if(a.h > hmax) hmax = a.h;
  });
  v = (redY - hmax - 8) / (STAGES[stageIdx].T * (window.GD_SLOW ? window.GD_SLOW_K : 1));
}
function place(a){
  var y = 8 + a.s * H + elapsed * v;
  a.x = (a.col + 0.5) * (Wd / 3);
  a.y = y;
  a.el.style.transform = "translate3d(" + (a.x - a.w / 2) + "px," + y + "px,0)";
}
function tick(ts){
  if(!active) return;
  rafId = requestAnimationFrame(tick);
  var dt = lastTs ? Math.min(ts - lastTs, 50) : 16;
  lastTs = ts;
  if(screen !== "q" || !answers.length) return;
  measure();
  if(falling && !paused){ elapsed += dt / 1000; }
  var colW = Wd / 3;
  for(var i = 0; i < answers.length; i++){
    var a = answers[i];
    if(a.gone) continue;
    a.w = Math.min(colW - 16, 230);
    a.el.style.width = a.w + "px";
    place(a);
  }
  if(falling && !paused && qOpen){
    for(var j = 0; j < answers.length; j++){
      var b = answers[j];
      if(b.gone || b.y + b.h < redY) continue;
      if(b.ok){ miss(b); return; }
      vanish(b);
    }
  }
}

// ---------- hiệu ứng ----------
function addFx(el){ fxLayer.appendChild(el); return el; }
function later2(fn, ms){ setTimeout(fn, ms); }
function rm(n, ms){ later2(function(){ if(n.parentNode) n.parentNode.removeChild(n); }, ms); }
function spark(x, y, bad){
  var set = bad ? ["💥","💨","✖️"] : (TH.spark || ["⭐","✨","💫","🌟"]);
  var n = bad ? 9 : 14;
  for(var i = 0; i < n; i++){
    var s = document.createElement("i");
    s.className = "rk-spark";
    s.textContent = set[i % set.length];
    var ang = Math.random() * Math.PI * 2, dist = 55 + Math.random() * 95;
    s.style.left = x + "px"; s.style.top = y + "px";
    s.style.fontSize = (16 + Math.random() * 16) + "px";
    s.style.fontStyle = "normal";
    s.style.setProperty("--dx", Math.cos(ang) * dist + "px");
    s.style.setProperty("--dy", Math.sin(ang) * dist + "px");
    addFx(s); rm(s, 850);
  }
  var r = document.createElement("i");
  r.className = "rk-ring" + (bad ? " rk-bad" : "");
  r.style.left = x + "px"; r.style.top = y + "px";
  addFx(r); rm(r, 650);
}
function floatText(text, x, y, sub, cls){
  var f = document.createElement("div");
  f.className = "rk-float" + (cls ? " " + cls : "");
  f.innerHTML = text + (sub ? "<small>" + sub + "</small>" : "");
  f.style.left = Math.max(60, Math.min(Wd - 60, x)) + "px"; f.style.top = y + "px";
  addFx(f); rm(f, 1600);
}
function flash(kind){
  flashEl.classList.remove("go", "heal");
  void flashEl.offsetWidth;
  if(kind === "heal"){ flashEl.classList.add("heal"); }
  flashEl.classList.add("go");
}
function shakeField(){
  fieldEl.classList.remove("rk-shake"); void fieldEl.offsetWidth; fieldEl.classList.add("rk-shake");
  later2(function(){ fieldEl.classList.remove("rk-shake"); }, 420);
}
function riseHearts(){
  for(var i = 0; i < 9; i++){
    var h = document.createElement("i");
    h.className = "rk-rise";
    h.textContent = i % 3 === 0 ? "💖" : "❤️";
    h.style.fontStyle = "normal";
    h.style.left = (Wd * 0.5 + (Math.random() - .5) * Math.min(Wd * .7, 420)) + "px";
    h.style.top = (H - 90) + "px";
    h.style.animationDelay = (i * .06) + "s";
    addFx(h); rm(h, 1800);
  }
}
function beam(a, bad){
  var rh = rocketEl.offsetHeight;
  var noseY = H - 12 - rh;
  var targetY = a.y + a.h / 2;
  var len = Math.max(20, noseY - targetY);
  var b = document.createElement("div");
  b.className = "rk-beam" + (bad ? " rk-bad" : "");
  b.style.left = a.x + "px"; b.style.bottom = (12 + rh) + "px"; b.style.height = len + "px";
  addFx(b); rm(b, 420);
}
function vanish(a){
  if(a.gone) return;
  a.gone = true;
  a.el.classList.add("rk-gone");
  rm(a.el, 320);
}
function fadeOthers(except){
  answers.forEach(function(a){ if(a !== except && !a.gone){ vanish(a); } });
}
function say(w){ return w.h + " " + w.py + " (" + w.vn + ")"; }

// ---------- vòng chơi ----------
function buildAnswers(q){
  ansLayer.innerHTML = ""; fxLayer.innerHTML = "";
  var ids = shuffle([q.w].concat(q.d));
  var stag = shuffle(STAGGER);
  answers = ids.map(function(id, i){
    var w = W[id];
    var el = document.createElement("button");
    el.type = "button"; el.tabIndex = -1;
    el.className = "rk-ans rk-c" + i + (q.dir === "H" ? " k-pm" : (q.dir === "C" ? " k-all" : " k-hp"));
    el.setAttribute("data-col", i);
    var inn = document.createElement("span");
    inn.className = "rk-ans-in";
    inn.innerHTML = q.dir === "H"
      ? '<span class="rk-p">' + w.py + '</span><span class="rk-m">' + w.vn + '</span>'
      : (q.dir === "C"
          ? '<span class="rk-p">' + w.py + '</span><b class="rk-h">' + w.h + '</b><span class="rk-m">' + w.vn + '</span>'
          : '<span class="rk-p">' + w.py + '</span><b class="rk-h">' + w.h + '</b>');
    el.appendChild(inn);
    ansLayer.appendChild(el);
    return { el:el, inn:inn, id:id, col:i, ok:(id === q.w), gone:false, s:stag[i], x:0, y:0, w:0, h:0 };
  });
}
function armFall(){
  var my = qEpoch;
  clearTimeout(safetyT);
  safetyT = setTimeout(function(){ if(my === qEpoch && qOpen){ falling = true; } }, 700);   // cho bé kịp đọc đề
}
function startQuestion(){
  screen = "q"; qEpoch++;
  stageIdx = stageOf(idx);
  coverEl.classList.remove("rk-on");
  coverEl.innerHTML = "";
  var q = Q[idx];
  buildAnswers(q);
  showPrompt(q);
  elapsed = 0; falling = false; qOpen = true; locked = false; probs = false;
  layout();
  answers.forEach(place);
  hideBanner();
  updateBar();
  var my = qEpoch;
  later(function(){ if(my === qEpoch && qOpen && !paused){ armFall(); } }, 450);
}
function noteProblem(){
  probs = true;
  if(missed.indexOf(idx) < 0){ missed.push(idx); }
}
function shoot(a, cb){
  var my = qEpoch;
  locked = true;
  rocketEl.style.left = a.x + "px";
  later(function(){
    if(my !== qEpoch) return;
    sfxPew();
    rocketEl.classList.add("fire");
    later2(function(){ rocketEl.classList.remove("fire"); }, 330);
    beam(a, !a.ok);
    later(function(){ if(my === qEpoch) cb(); }, 170);
  }, 300);
}
function pick(a){
  if(screen !== "q" || !qOpen || locked || paused || !a || a.gone) return;
  getCtx();
  stopAudio(); clearTimeout(safetyT);
  if(a.ok){
    var ratio = Math.min(1, elapsed / (STAGES[stageIdx].T * (window.GD_SLOW ? window.GD_SLOW_K : 1)));
    qOpen = false; falling = false;
    shoot(a, function(){
      a.el.classList.add("rk-hit");
      spark(a.x, a.y + a.h / 2, false);
      sfxOk();
      var cq = Q[idx];
      if(cq.dir === "C"){ speak({ h: SENT[cq.s].zh.replace("＿＿", W[cq.w].h) }, null); }   // đọc cả câu hoàn chỉnh
      else { playWord(W[a.id], null); }   // đọc lại từ đúng để bé nhớ âm
      streak++; if(streak > bestStreak){ bestStreak = streak; }
      hits++; if(!probs){ cleanHits++; }
      var base = STAGES[stageIdx].base, pts = probs ? Math.round(base / 2) : base;
      var speed = 0, speedLbl = "";
      if(!probs){
        if(ratio < .4){ speed = 5; speedLbl = "⚡ Siêu nhanh +5"; }
        else if(ratio < .7){ speed = 2; speedLbl = "⚡ Nhanh +2"; }
      }
      var comboB = Math.min(Math.max(streak - 1, 0), 5) * 2;
      var total = pts + speed + comboB;
      var heal = false, gem = false;
      if(streak % HEAL_EVERY === 0){
        if(lives < MAXLIVES){ lives++; heal = true; heartFx = { t:"gain", i:lives - 1 }; }
        else { gem = true; total += 30; }
        meterFull = true;
        clearTimeout(meterT);
        meterT = setTimeout(function(){ meterFull = false; if(active){ updateBar(); } }, 1100);
      }
      score += total;
      var subs = [];
      if(speedLbl) subs.push(speedLbl);
      if(comboB) subs.push("🔥 Combo +" + comboB);
      floatText("+" + total, a.x, a.y, subs.join("  "));
      if(streak >= 3){ sfxCombo(streak); }
      if(heal){
        later(function(){
          sfxHeal(); riseHearts(); flash("heal");
          floatText("❤️ +1 tim!", Wd / 2, H * 0.4, "Đúng liền " + HEAL_EVERY + " câu!", "heal");
        }, 350);
      } else if(gem){
        later(function(){ sfxHeal(); floatText("💎 +30", Wd / 2, H * 0.4, "Đúng liền " + HEAL_EVERY + " câu!", "heal"); }, 350);
      }
      popScore(); bumpCombo(); updateBar();
      fadeOthers(a);
      later(function(){ a.gone = true; if(a.el.parentNode) a.el.parentNode.removeChild(a.el); nextQ(); }, heal || gem ? 1700 : 1300);
    });
  } else {
    shoot(a, function(){
      a.el.classList.add("rk-wrong");
      spark(a.x, a.y + a.h / 2, true);
      sfxNo(); flash("bad"); shakeField();
      lives--; streak = 0; meterFull = false; noteProblem();
      heartFx = { t:"lose", i:lives };
      updateBar();
      if(lives <= 0){
        qOpen = false; falling = false;
        later(function(){ gameOver(); }, 900);
      } else {
        later(function(){ vanish(a); locked = false; if(qOpen && !falling){ armFall(); } }, 450);
      }
    });
  }
}
function miss(a){
  qOpen = false; falling = false; locked = true;
  lives--; streak = 0; meterFull = false; noteProblem();
  heartFx = { t:"lose", i:lives };
  a.el.classList.add("rk-wrong");
  spark(a.x, redY - 6, true);
  sfxNo(); flash("bad"); shakeField();
  fadeOthers(a);
  banner("Chưa kịp rồi! Đáp án là: " + say(W[a.id]), 2600);
  updateBar();
  var w = W[a.id];
  later(function(){ playWord(w, null); }, 500);
  if(lives <= 0){ later(function(){ gameOver(); }, 1700); }
  else { later(function(){ nextQ(); }, 2600); }
}
function nextQ(){
  idx++;
  if(idx >= Q.length){
    finalBonus = 20 + 10 * lives + 50 + (missed.length ? 0 : 100);
    score += finalBonus;
    renderEnd(true);
    return;
  }
  var s = stageOf(idx);
  if(idx === STAGES[s].from){
    stageBonus = 20 + 10 * lives;
    score += stageBonus;
    popScore();
    renderCover(s);
  } else { startQuestion(); }
}
function gameOver(){ renderEnd(false); }

// ---------- màn giới thiệu chặng / kết quả ----------
function clearField(){
  qOpen = false; falling = false; answers = [];
  ansLayer.innerHTML = ""; fxLayer.innerHTML = "";
  clearTimeout(safetyT); hideBanner(); hidePrompt();
}
function chipHtml(id){
  var w = W[id];
  return '<button class="rk-chip" type="button" data-w="' + id + '">' +
    '<span class="cp">' + w.py + '</span><span class="ch">' + w.h + '</span><span class="cm">' + w.vn + '</span></button>';
}
function renderCover(s){
  screen = "cover"; stageIdx = s; qEpoch++;
  clearField();
  rocketEl.style.left = "50%";
  var st = STAGES[s], first = (s === 0 && idx === 0);
  var sb = stageBonus; stageBonus = 0;
  coverEl.innerHTML =
    '<div class="rk-card" style="--rk-title:' + st.color + '">' +
      '<div class="rk-big">' + (first ? TH.shooter : st.emoji) + '</div>' +
      '<h2>' + (first ? TH.title : "Chặng " + (s + 1) + " · " + st.name) + '</h2>' +
      (first ? '<p class="rk-subt">Bấm vào thẻ đúng nhé!</p>' : '') +
      (sb ? '<div class="rk-bonus">🎁 +' + sb + ' ⭐</div>' : '') +
      '<button class="rk-go rk-go-big" id="rk-go" type="button">' + (first ? "Bắt đầu ▶" : "Sẵn sàng ▶") + '</button>' +
    '</div>';
  coverEl.classList.add("rk-on");
  updateBar();
  if(!first){ sfxStage(); }
}
function renderEnd(win){
  screen = "end"; qEpoch++;
  clearField(); stopAudio();
  var perfect = win && missed.length === 0;
  var best = loadBest(), record = false;
  if(score > best){ best = score; record = true; saveBest(score); }
  var stars = win ? Math.max(1, Math.ceil(lives * 3 / MAXLIVES)) : 0;
  var starHtml = "";
  for(var i = 0; i < 3; i++){

      return;

    var pool = shuffle(W.map(function(_, i){ return i; }));
