function banner(text, ms){
  bannerEl.textContent = text;
  bannerEl.classList.add("fb-show");
  clearTimeout(bannerT);
  if(ms){ bannerT = setTimeout(function(){ bannerEl.classList.remove("fb-show"); }, ms); }
}
function hideBanner(){ clearTimeout(bannerT); bannerEl.classList.remove("fb-show"); }

// ---------- thanh trên ----------
function updateBar(){
  var st = STAGES[stageIdx];
  stageEl.textContent = st.emoji;
  qnumEl.innerHTML = screen === "q" ? window.GD_PROG(idx, Q.length) : "";
  var h = "";
  for(var i = 0; i < MAXLIVES; i++){
    var cls = "fb-heart" + (i < lives ? "" : " off") + (heartFx && heartFx.i === i ? " " + heartFx.t : "");
    h += '<span class="' + cls + '">❤️</span>';
  }
  heartsEl.innerHTML = h;
  heartFx = null;
  scoreEl.textContent = "⭐ " + score;
  var on = meterFull ? HEAL_EVERY : (streak % HEAL_EVERY);
  for(var p = 0; p < pipEls.length; p++){ pipEls[p].classList.toggle("on", p < on); }
  meterEl.classList.toggle("full", meterFull);
  meterTxt.textContent = lives < MAXLIVES ? "❤️" : "💎";
  if(streak >= 2){ comboEl.textContent = "🔥 x" + streak; comboEl.classList.add("show"); }
  else { comboEl.classList.remove("show"); }
}
function popScore(){ scoreEl.classList.remove("fb-pop"); void scoreEl.offsetWidth; scoreEl.classList.add("fb-pop"); }
function bumpCombo(){ comboEl.classList.remove("bump"); void comboEl.offsetWidth; comboEl.classList.add("bump"); }

// ---------- đề bài ----------
function showPrompt(q){
  var w = W[q.w];
  promptEl.style.display = "flex";
  promptEl.classList.toggle("cz", q.dir === "C");
  if(q.dir === "C"){
    var S = SENT[q.s];
    var zh = S.zh.replace("＿＿", '<span class="blank">＿＿</span>');
    var py = S.py.replace("___", '<span class="blank">___</span>');
    promptEl.innerHTML = '<span class="pp">' + py + '</span><span class="pz">' + zh + '</span><span class="pv">' + S.vn + '</span>';
  } else if(q.dir === "H"){
    promptEl.innerHTML = '<span class="pz">' + w.h + '</span><span class="pw"><span class="pv">Chữ này là gì?</span></span>';
  } else {
    promptEl.innerHTML = '<span class="pe">' + w.em + '</span><span class="pw"><span class="pv">' + w.vn + '</span></span>';
  }
  promptEl.classList.remove("pop"); void promptEl.offsetWidth; promptEl.classList.add("pop");
}
function hidePrompt(){ promptEl.style.display = "none"; promptEl.innerHTML = ""; }

// ---------- hiệu ứng ----------
function addFx(el){ fxLayer.appendChild(el); return el; }
function rm(n, ms){ later2(function(){ if(n.parentNode) n.parentNode.removeChild(n); }, ms); }
function spark(x, y, bad){
  var set = bad ? ["💥","💨","✖️"] : ["⭐","✨","💫","🌟"];
  var n = bad ? 9 : 14;
  for(var i = 0; i < n; i++){
    var s = document.createElement("i");
    s.className = "fb-spark";
    s.textContent = set[i % set.length];
    var ang = Math.random() * Math.PI * 2, dist = 55 + Math.random() * 95;
    s.style.left = x + "px"; s.style.top = y + "px";
    s.style.fontSize = (16 + Math.random() * 16) + "px";
    s.style.setProperty("--dx", Math.cos(ang) * dist + "px");
    s.style.setProperty("--dy", Math.sin(ang) * dist + "px");
    addFx(s); rm(s, 850);
  }
  var r = document.createElement("i");
  r.className = "fb-ring" + (bad ? " fb-bad" : "");
  r.style.left = x + "px"; r.style.top = y + "px";
  addFx(r); rm(r, 650);
}
function floatText(text, x, y, sub, cls){
  var f = document.createElement("div");
  f.className = "fb-float" + (cls ? " " + cls : "");
  f.innerHTML = text + (sub ? "<small>" + sub + "</small>" : "");
  var FW = fieldEl.clientWidth;
  f.style.left = Math.max(70, Math.min(FW - 70, x)) + "px"; f.style.top = y + "px";
  addFx(f); rm(f, 1600);
}
function riseHearts(){
  var FW = fieldEl.clientWidth, FH = fieldEl.clientHeight;
  for(var i = 0; i < 9; i++){
    var h = document.createElement("i");
    h.className = "fb-rise";
    h.textContent = i % 3 === 0 ? "💖" : "❤️";
    h.style.left = (FW * 0.5 + (Math.random() - .5) * Math.min(FW * .7, 420)) + "px";
    h.style.top = (FH - 90) + "px";
    h.style.animationDelay = (i * .06) + "s";
    addFx(h); rm(h, 1800);
  }
}

// ---------- 4 ô trong gôn ----------
function zoneHtml(id, dir){
  var w = W[id];
  if(dir === "H"){ return '<span class="fz-p big">' + w.py + '</span><span class="fz-m">' + w.vn + '</span>'; }
  if(dir === "M"){ return '<span class="fz-p">' + w.py + '</span><span class="fz-h">' + w.h + '</span>'; }
  return '<span class="fz-p">' + w.py + '</span><span class="fz-h">' + w.h + '</span><span class="fz-m">' + w.vn + '</span>';
}
function fitZones(){
  zones.forEach(function(z){
    var w = z.el.clientWidth, h = z.el.clientHeight;
    var three = z.lab.querySelector(".fz-m") && z.lab.querySelector(".fz-h");
    var fs = Math.min((h - 12) / (three ? 5.2 : 3.9), (w - 24) / 9.2, 26);
    z.lab.style.fontSize = Math.max(11, fs) + "px";
  });
}
function setZones(q){
  var ids = shuffle([q.w].concat(q.d));
  zones.forEach(function(z, i){
    z.id = ids[i]; z.ok = (ids[i] === q.w); z.off = false;
    z.lab.innerHTML = zoneHtml(ids[i], q.dir);
    z.el.classList.remove("fb-off", "fb-hit");
  });
  fitZones();
}
function resetZones(){
  zones.forEach(function(z){ z.off = false; z.el.classList.remove("fb-off", "fb-hit"); });
}
function ballHome(animate){
  ballEl.style.transition = animate ? "transform .45s ease" : "none";
  ballEl.style.transform = "none";
  if(!animate){ void ballEl.offsetWidth; ballEl.style.transition = ""; }
}
function keeperHome(){ keeperEl.classList.remove("show"); keeperEl.style.left = "50%"; }
function shootBall(z, ok, cb){
  var my = qEpoch;
  locked = true;
  ballEl.style.transition = "none";
  ballEl.style.transform = "none";
  void ballEl.offsetWidth;
  ballEl.style.transition = "";
  var br = ballEl.getBoundingClientRect(), zr = z.el.getBoundingClientRect(), gr = goalEl.getBoundingClientRect();
  var sx = br.left + br.width / 2, sy = br.top + br.height / 2;
  var tx = zr.left + zr.width / 2, ty = zr.top + zr.height * (ok ? 0.5 : 0.8);
  var kx = zr.left + zr.width / 2;
  if(ok){
    var others = zones.filter(function(o){ return o !== z; });
    var oz = others[Math.floor(Math.random() * others.length)].el.getBoundingClientRect();
    kx = oz.left + oz.width / 2;
  }
  later(function(){
    if(my !== qEpoch) return;
    sfxKick();
    keeperEl.classList.add("show");
    keeperEl.style.left = (kx - gr.left) + "px";
    ballEl.style.transform = "translate(" + (tx - sx) + "px," + (ty - sy) + "px) scale(.55) rotate(540deg)";
    later(function(){
      if(my !== qEpoch) return;
      var fr = fieldEl.getBoundingClientRect();
      cb({ x: tx - fr.left, y: ty - fr.top });
    }, 520);
  }, 250);
}

// ---------- vòng chơi ----------
function startQuestion(){
  screen = "q"; qEpoch++;
  stageIdx = stageOf(idx);
  coverEl.classList.remove("fb-on");
  coverEl.innerHTML = "";
  hideBanner(); fxLayer.innerHTML = "";
  keeperHome(); ballHome(false);
  var q = Q[idx];
  showPrompt(q);
  setZones(q);
  qOpen = true; locked = false; probs = false;
  timerAcc = 0; timerStart = null;
  updateBar();
  var my = qEpoch;
  later(function(){ if(my === qEpoch && qOpen){ tRun(); } }, 700);   // cho bé kịp đọc đề rồi mới tính giờ
}
function noteProblem(){
  probs = true;
  if(missed.indexOf(idx) < 0){ missed.push(idx); }
}
function pick(i){
  if(screen !== "q" || !qOpen || locked || paused) return;
  var z = zones[i];
  if(!z || z.off) return;
  getCtx(); AU.stop();
  if(z.ok){
    var ratio = Math.min(1, tNow() / STAGES[stageIdx].T);
    tHold();
    qOpen = false;
    shootBall(z, true, function(pt){ onGoal(z, pt, ratio); });
  } else {
    shootBall(z, false, function(pt){ onSave(z, pt); });
  }
}
function onGoal(z, pt, ratio){
  var my = qEpoch, q = Q[idx];
  z.el.classList.add("fb-hit");
  spark(pt.x, pt.y, false);
  sfxGoal();
  // đọc từ đúng (hoặc cả câu hoàn chỉnh) để bé nhớ âm
  later(function(){
    if(my !== qEpoch) return;
    if(q.dir === "C"){ AU.speak({ h: SENT[q.s].zh.replace("＿＿", W[q.w].h) }, null); }
    else { AU.play(W[q.w], null); }
  }, 600);
  streak++; if(streak > bestStreak){ bestStreak = streak; }
  hits++; if(!probs){ cleanHits++; }
  var base = STAGES[stageIdx].base, pts = probs ? Math.round(base / 2) : base;
  var speed = 0, speedLbl = "";
  if(!probs){
    if(ratio < .4){ speed = 5; speedLbl = "⚡ Siêu nhanh +5"; }
    else if(ratio < .7){ speed = 2; speedLbl = "⚡ Nhanh +2"; }
  }
  var comboB = Math.min(Math.max(streak - 1, 0), 5) * 2;
  var total = pts + speed + comboB;
  var heal = false, gem = false;
  if(streak % HEAL_EVERY === 0){
    if(lives < MAXLIVES){ lives++; heal = true; heartFx = { t:"gain", i:lives - 1 }; }
    else { gem = true; total += 30; }
    meterFull = true;
    clearTimeout(meterT);
    meterT = setTimeout(function(){ meterFull = false; if(active){ updateBar(); } }, 1100);
  }
  score += total;
  var subs = [];
  if(speedLbl) subs.push(speedLbl);
  if(comboB) subs.push("🔥 Combo +" + comboB);
  floatText("+" + total, pt.x, pt.y, subs.join("  "));
  if(streak >= 3){ sfxCombo(streak); }
  var FH = fieldEl.clientHeight, FW = fieldEl.clientWidth;
  if(heal){
    later(function(){
      sfxHeal(); riseHearts();
      floatText("❤️ +1 tim!", FW / 2, FH * 0.55, "Đúng liền " + HEAL_EVERY + " câu!", "heal");
    }, 350);
  } else if(gem){
    later(function(){ sfxHeal(); floatText("💎 +30", FW / 2, FH * 0.55, "Đúng liền " + HEAL_EVERY + " câu!", "heal"); }, 350);
  }
  popScore(); bumpCombo(); updateBar();
  later(function(){ if(my === qEpoch){ nextQ(); } }, heal || gem ? 2200 : 1900);
}
function onSave(z, pt){
  var my = qEpoch;
  z.off = true; z.el.classList.add("fb-off");
  spark(pt.x, pt.y, true);
  sfxSave();
  lives--; streak = 0; meterFull = false; noteProblem();
  heartFx = { t:"lose", i:lives };
  updateBar();
  later(function(){ if(my === qEpoch){ ballHome(true); } }, 250);
  if(lives <= 0){
    qOpen = false;
    later(function(){ gameOver(); }, 1000);
  } else {
    banner("Chưa đúng, thử lại nhé! 💪", 1400);
    later(function(){
      if(my !== qEpoch) return;
      keeperHome(); locked = false;
    }, 800);
  }
}
function nextQ(){
  idx++;
  if(idx >= Q.length){
    finalBonus = 20 + 10 * lives + 50 + (missed.length ? 0 : 100);
    score += finalBonus;
    renderEnd(true);
    return;
  }
  var s = stageOf(idx);
  if(idx === STAGES[s].from){
    stageBonus = 20 + 10 * lives;
    score += stageBonus;
    popScore();
    renderCover(s);
  } else { startQuestion(); }
}
function gameOver(){ renderEnd(false); }

// ---------- màn giới thiệu chặng / kết quả ----------
function clearField(){
  qOpen = false; locked = false;
  fxLayer.innerHTML = "";
  hideBanner(); resetZones(); keeperHome(); ballHome(false); hidePrompt();
  tHold();
}
function chipHtml(id){
  var w = W[id];
  return '<button class="fb-chip" type="button" data-w="' + id + '">' +
    '<span class="cp">' + w.py + '</span><span class="ch">' + w.h + '</span><span class="cm">' + w.vn + '</span></button>';
}
function renderCover(s){
  screen = "cover"; stageIdx = s; qEpoch++;
  clearField();
  var st = STAGES[s], first = (s === 0 && idx === 0);
  var sb = stageBonus; stageBonus = 0;
  coverEl.innerHTML =
    '<div class="fb-card" style="--fb-title:' + st.color + '">' +
      '<div class="fb-big">' + (first ? "⚽" : st.emoji) + '</div>' +
      '<h2>' + (first ? "Sút bóng vào gôn" : "Chặng " + (s + 1) + " · " + st.name) + '</h2>' +
      (first ? '<p class="fb-subt">Bấm vào ô đúng nhé!</p>' : '') +
      (sb ? '<div class="fb-bonus">🎁 +' + sb + ' ⭐</div>' : '') +
      '<button class="fb-go fb-go-big" id="fb-go" type="button">' + (first ? "Bắt đầu ▶" : "Sẵn sàng ▶") + '</button>' +
    '</div>';
  coverEl.classList.add("fb-on");
  updateBar();
  if(!first){ sfxStage(); }
}
function renderEnd(win){
  screen = "end"; qEpoch++;
  clearField(); AU.stop();
  var perfect = win && missed.length === 0;
  var best = loadBest(), record = false;
  if(score > best){ best = score; record = true; saveBest(score); }
  var stars = win ? Math.max(1, Math.ceil(lives * 3 / MAXLIVES)) : 0;
  var starHtml = "";
  for(var i = 0; i < 3; i++){
    starHtml += i < stars ? '<span class="fb-on-s" style="animation-delay:' + (i * .25) + 's">⭐</span>' : '<span class="fb-off-s">⭐</span>';
  }
  var review = "";
  if(missed.length){
    review = '<div class="fb-review"><div class="fb-review-t">🔊 Nghe lại nhé:</div><div class="fb-chips">';
    var seen = {};
    missed.slice().sort(function(a, b){ return a - b; }).forEach(function(qi){
      var id = Q[qi].w;
      if(seen[id]) return; seen[id] = true;
      review += chipHtml(id);
    });
    review += '</div></div>';
  }
  var head = win
    ? '<div class="fb-stars-row">' + starHtml + '</div><h2>' + (perfect ? "Cầu thủ siêu sao! 🌟" : "Cầu thủ xuất sắc! 🎉") + '</h2>'
    : '<div class="fb-big">🧤</div><h2>Hết tim rồi! Đá lại nhé! 💪</h2>';
  var meta = '<div class="fb-end-meta">⭐ ' + score + (record ? ' · 🏅 Kỷ lục mới!' : ' · 🏅 ' + best) + '</div>';
  coverEl.innerHTML =
    '<div class="fb-card">' + head + review +
      '<button class="fb-go fb-go-big" id="fb-again" type="button">🔁 Chơi lại</button>' +
      '<div class="fb-row">' +
        '<button class="fb-go fb-alt fb-go-mini" id="fb-back" type="button" aria-label="Về menu" title="Về menu">🏠</button>' +
      '</div>' + meta +
    '</div>';
  coverEl.classList.add("fb-on");
  updateBar();
  if(win){ sfxWin(); confetti(); } else { sfxLose(); }
}
function confetti(){
  var box = document.createElement("div");
  box.className = "fb-confetti";
  var colors = ["#FF7E94","#ACD9F7","#6CC6AA","#B7A3E3","#FFE27A"];
  var h = "";
  for(var i = 0; i < 56; i++){
    h += '<i style="left:' + (Math.random() * 100).toFixed(1) + '%;background:' + colors[i % colors.length] +
         ';animation-duration:' + (2.4 + Math.random() * 2.2).toFixed(2) + 's;animation-delay:' + (Math.random() * 1.2).toFixed(2) + 's"></i>';
  }
  box.innerHTML = h;
  fieldEl.appendChild(box);
  setTimeout(function(){ if(box.parentNode) box.parentNode.removeChild(box); }, 6500);
}

// ---------- vòng đời game ----------
function resetGame(){
  // mỗi lần vào chơi / chơi lại: bốc và xáo đề mới; nếu trùng y hệt thứ tự ván trước thì bốc lại
  var sig = "", tries = 0;
  do{
    buildQuestions();
    sig = Q.map(function(q){ return q.w + q.dir + (q.s != null ? "s" + q.s : "") + ":" + q.d.join("."); }).join(",");
    tries++;
  } while(sig === resetGame.last && tries < 30);
  resetGame.last = sig;
  epoch++; pending = []; AU.stop();
  idx = 0; lives = MAXLIVES; score = 0; streak = 0; bestStreak = 0; hits = 0; cleanHits = 0; missed = [];
  heartFx = null; meterFull = false; clearTimeout(meterT); stageBonus = 0; finalBonus = 0;
  paused = false; ov.classList.remove("fb-paused");
  confirmEl.classList.remove("fb-on");
  var old = fieldEl.querySelector(".fb-confetti"); if(old) old.parentNode.removeChild(old);
  timerAcc = 0; timerStart = null;
  renderCover(0);
}
function startGame(){
  if(active) return;
  active = true;
  getCtx();
  ov.classList.add("fb-on");
  resetGame();
}
function exitGame(){
  if(!active) return;
  active = false; paused = false; epoch++; pending = [];
  AU.stop(); clearTimeout(bannerT); clearTimeout(meterT); tHold();
  confirmEl.classList.remove("fb-on");
  ov.classList.remove("fb-on", "fb-paused");
  var old = fieldEl.querySelector(".fb-confetti"); if(old) old.parentNode.removeChild(old);
  if(window.GM_SHOW){ window.GM_SHOW(); }
}
function openDialog(mode){
  if(!active || paused) return;
  paused = true; AU.stop(); tHold();
  ov.classList.add("fb-paused");
  if(mode === "pause"){
    $("fb-d-ico").textContent = "⏸";
    $("fb-d-title").textContent = "Tạm dừng";
    $("fb-d-sub").textContent = "";
    $("fb-d-continue").textContent = "▶ Chơi tiếp";
  } else {
    $("fb-d-ico").textContent = "🤔";
    $("fb-d-title").textContent = "Chơi tiếp?";
    $("fb-d-sub").textContent = "";
    $("fb-d-continue").textContent = "▶ Chơi tiếp";
  }
  confirmEl.classList.add("fb-on");
}
function closeDialog(){
  if(!paused) return;
  paused = false;
  ov.classList.remove("fb-paused");
  confirmEl.classList.remove("fb-on");
  var todo = pending; pending = [];
  todo.forEach(function(p){ if(p.e === epoch && active){ p.f(); } });
  if(screen === "q" && qOpen && timerAcc > 0){ tRun(); }
}
function askExit(){
  if(screen === "end" || (screen === "cover" && idx === 0 && stageIdx === 0)){ exitGame(); }
  else { openDialog("exit"); }
}
function listenNow(){
  if(screen !== "q" || !qOpen || paused) return;
  getCtx();
  if(Q[idx].dir === "C"){ banner("Bé đọc câu rồi chọn từ còn thiếu nhé!", 2200); }
  else { AU.play(W[Q[idx].w], null); }
}

// ---------- sự kiện ----------
$("fb-exit").addEventListener("click", askExit);
$("fb-pause").addEventListener("click", function(){ if(screen === "q" || screen === "cover"){ openDialog("pause"); } });
muteBtn.addEventListener("click", function(){
  muted = !muted;
  muteBtn.textContent = muted ? "🔕" : "🔔";
  muteBtn.setAttribute("aria-label", muted ? "Bật âm báo" : "Tắt âm báo");
});
$("fb-listen").addEventListener("click", listenNow);
$("fb-d-continue").addEventListener("click", closeDialog);
$("fb-d-quit").addEventListener("click", exitGame);
zonesEl.addEventListener("pointerdown", function(e){
  var el = e.target.closest ? e.target.closest(".fb-zone") : null;
  if(!el) return;
  e.preventDefault();
  pick(+el.getAttribute("data-i"));
});
coverEl.addEventListener("click", function(e){
  var t = e.target;
  if(t.closest("#fb-go")){ getCtx(); idx = STAGES[stageIdx].from; startQuestion(); return; }
  var chip = t.closest(".fb-chip");
  if(chip){ AU.play(W[+chip.getAttribute("data-w")], null); return; }
  if(t.closest("#fb-again")){ resetGame(); return; }
  if(t.closest("#fb-back")){ exitGame(); return; }
});
window.addEventListener("resize", function(){ if(active){ fitZones(); } });
document.addEventListener("visibilitychange", function(){
  if(active && document.hidden && !paused && (screen === "q" || screen === "cover")){ openDialog("pause"); }
});
document.addEventListener("keydown", function(e){
  if(!active) return;
  if(e.key === "Escape"){
    if(paused){ closeDialog(); } else { askExit(); }
    return;
  }
  if(paused || screen !== "q") return;
  if(e.key >= "1" && e.key <= "4"){ pick(+e.key - 1); }
  else if(e.key === "r" || e.key === "R"){ listenNow(); }
});

window.FB_START = startGame;
window.GD_GAMES.push({ id:"football", ico:"⚽", desc:"Sút bóng vào gôn", cls:"gm-c2", start:startGame });
})();
</script>

<script>
/* ============================================================
   GAME 3 — NGHIÊNG ĐẦU CHỌN ĐÁP ÁN
   - Đề bài ở trên đầu, 2 thẻ TRÁI / PHẢI (1 đúng + 1 nhiễu). Bé nghiêng đầu sang thẻ đúng
     (📷 camera nhận góc nghiêng — cần internet để tải bộ nhận diện MediaPipe) hoặc bấm ← / →, phím 1 / 2, chạm thẻ (⌨ chạy offline).
       Kiểu H: cho chữ Hán   → thẻ có PHIÊN ÂM + NGHĨA
       Kiểu M: cho nghĩa     → thẻ có CHỮ HÁN + PHIÊN ÂM
       Kiểu C: câu thiếu từ  → thẻ có TỪ (chữ Hán + phiên âm + nghĩa) điền đúng
   - 4 chặng, 24 câu, 5 tim. Chọn nhầm: mất 1 tim, 2 thẻ đổi chỗ, bé được chọn lại.
   - Điểm: gốc 10/12/15/20 · nhanh ⚡ +2/+5 · combo 🔥 tối đa +10 · câu từng chọn nhầm chỉ nửa điểm gốc

function allIds(){ return W.map(function(_, i){ return i; }); }
function wordQ(id, dir){

function sentQ(si){ var S = SENT[si]; return { w:S.a, d:S.d.concat(S.e || []), dir:"C", s:si }; }
function pickSent(n, usedS){
  var order = shuffle(SENT.map(function(_, i){ return i; })), picked = [], qn = 0;
  for(var i = 0; i < order.length && picked.length < n; i++){
    if(usedS[order[i]]) continue;

    var rest = pool.filter(function(i){ return used[i]; });
    var ids = fresh.concat(rest).slice(0, n);
    ids.forEach(function(i){ used[i] = true; });
    return ids;
  }

    if(st.mode === "H" || st.mode === "M"){
      pickWords(st.n).forEach(function(id){ Q.push(wordQ(id, st.mode)); });
    } else if(st.mode === "C"){
      pickSent(st.n, usedS).forEach(function(si){ Q.push(sentQ(si)); });

      for(var z = 0; z < dirs.length && short > 0; z++){ if(dirs[z] === "C"){ dirs[z] = "H"; short--; } }   // thiếu câu → đổi sang đề chữ Hán

}

function tone(freq, start, dur, type, vol, endFreq){

  var c = getCtx(); if(!c) return;
  var t0 = c.currentTime + start;

  o.type = type || "sine";

  timerAcc = 0; timerStart = null;

}
function choose(side){
  if(screen !== "q" || !qOpen || locked || paused) return;
  getCtx(); AU.stop(); clearLean();
  locked = true; holdSide = null;
  if(side === okSide){
    var ratio = Math.min(1, tNow() / STAGES[stageIdx].T);
    tHold();
    qOpen = false;

  } else {
    onBad(side);
  }
}
function onGood(side, ratio){
  var my = qEpoch, c = cardOf(side), pt = cardCenter(c), q = Q[idx];
  c.el.classList.add("tl-ok");
  spark(pt.x, pt.y, false);
  sfxGood();
  setMsg("✅");
  // đọc từ đúng (hoặc cả câu hoàn chỉnh) để bé nhớ âm
  later(function(){
    if(my !== qEpoch) return;
    if(q.dir === "C"){ AU.speak({ h: SENT[q.s].zh.replace("＿＿", W[q.w].h) }, null); }
    else { AU.play(W[q.w], null); }
  }, 600);

  hits++; if(!probs){ cleanHits++; }

    else if(ratio < .7){ speed = 2; speedLbl = "⚡ Nhanh +2"; }
  }

  }

  if(comboB) subs.push("🔥 Combo +" + comboB);
  floatText("+" + total, pt.x, pt.y, subs.join("  "));
  if(streak >= 3){ sfxCombo(streak); }
  var FH = fieldEl.clientHeight, FW = fieldEl.clientWidth;
  if(heal){
    later(function(){
      sfxHeal(); riseHearts();
      floatText("❤️ +1 tim!", FW / 2, FH * 0.55, "Đúng liền " + HEAL_EVERY + " câu!", "heal");
    }, 350);
  } else if(gem){
    later(function(){ sfxHeal(); floatText("💎 +30", FW / 2, FH * 0.55, "Đúng liền " + HEAL_EVERY + " câu!", "heal"); }, 350);

function onBad(side){

  heartFx = { t:"lose", i:lives };
  updateBar();
  if(lives <= 0){
    qOpen = false;
    later(function(){ gameOver(); }, 1000);
  } else {
    later(function(){
      if(my !== qEpoch) return;
      setCards(Q[idx]);               // 2 thẻ đổi chỗ ngẫu nhiên, bé chọn lại
      armed = false; holdSide = null; clearLean();
      setMsg("");
      locked = false;
    }, 1100);
  }
}

  } else { startQuestion(); }
}

  if(camOn && lm && stream) return true;
  if(camBusy) return false;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    setStatus("⚠ Máy này không mở được camera. Bé chơi bằng phím ← / → hoặc chạm vào thẻ nhé."); return false;
  }
  camBusy = true;
  setStatus("⏳ Đang mở camera...");
  try{
    stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:"user", width:{ ideal:640 }, height:{ ideal:480 } }, audio:false });
  }catch(e){
    camBusy = false; stream = null;
    setStatus("⚠ Không mở được camera (" + ((e && e.name) || "lỗi") + "). Hãy cho phép camera hoặc chơi bằng phím / chạm.");
    return false;
  }
  setStatus("⏳ Đang tải bộ nhận diện khuôn mặt (cần internet)...");
  try{
    var base = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
    var vision = await import(base + "/vision_bundle.mjs");
    var fileset = await vision.FilesetResolver.forVisionTasks(base + "/wasm");
    var opts = function(d){ return {
      baseOptions:{ modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task", delegate:d },
      runningMode:"VIDEO", numFaces:1
    }; };
    var l;
    try{ l = await vision.FaceLandmarker.createFromOptions(fileset, opts("GPU")); }
    catch(e1){ l = await vision.FaceLandmarker.createFromOptions(fileset, opts("CPU")); }
    lm = l;
  }catch(e2){
    camBusy = false; stopCamera();
    setStatus("⚠ Không tải được bộ nhận diện (kiểm tra internet). Bé chơi bằng phím / chạm nhé.");
    return false;
  }
  camBusy = false;
  if(!active){ stopCamera(); return false; }
  camOn = true; baseAng = 0;
  videoEl.srcObject = stream;
  var pp = videoEl.play(); if(pp && pp.catch){ pp.catch(function(){}); }
  if(!looping){ looping = true; camLoop(); }
  updateMid();
  return true;
}
function camLoop(){
  if(!active || !camOn || !lm){ looping = false; return; }
  var now = performance.now();
  if(videoEl.readyState >= 2 && videoEl.videoWidth && now - lastDet > 60){
    lastDet = now;
    var ang = null;
    try{
      var res = lm.detectForVideo(videoEl, now);
      var f = res.faceLandmarks && res.faceLandmarks[0];
      if(f){
        var a = f[33], b = f[263];   // khoé mắt ngoài hai bên
        rawAng = Math.atan2((b.y - a.y) * videoEl.videoHeight, (b.x - a.x) * videoEl.videoWidth) * 180 / Math.PI;
        ang = rawAng - baseAng;
      }
    }catch(e){}
    handleAngle(ang, now);
  }
  requestAnimationFrame(camLoop);
}
function handleAngle(ang, now){
  if(ang === null){
    angEl.textContent = "😶 ?";
    holdSide = null; clearLean(); return;
  }
  angEl.textContent = Math.round(ang) + "° " + (ang > TILT_NEUTRAL ? "◀" : ang < -TILT_NEUTRAL ? "▶" : "•");
  if(screen !== "q" || !qOpen || locked || paused){ holdSide = null; clearLean(); return; }
  // phải đưa đầu về thẳng một lần ở đầu mỗi câu thì mới tính nghiêng
  if(!armed){ if(Math.abs(ang) < TILT_NEUTRAL){ armed = true; } return; }
  // góc dương = nghiêng về vai trái của bé = thẻ TRÁI (video đã lật gương)
  var side = ang > TILT_ANGLE ? "L" : ang < -TILT_ANGLE ? "R" : null;
  if(!side){ holdSide = null; clearLean(); return; }
  if(holdSide !== side){
    holdSide = side; holdT = now; clearLean();
    cardOf(side).el.classList.add("tl-lean");
  } else if(now - holdT >= TILT_HOLD_MS){
    choose(side);
  }
}

// ---------- màn giới thiệu chặng / kết quả ----------
function clearField(){
  qOpen = false; locked = false;
  fxLayer.innerHTML = "";
  hideBanner(); clearLean(); hidePrompt(); setMsg("");
  tHold();
}
function chipHtml(id){
  var w = W[id];
  return '<button class="tl-chip" type="button" data-w="' + id + '">' +
    '<span class="cp">' + w.py + '</span><span class="ch">' + w.h + '</span><span class="cm">' + w.vn + '</span></button>';
}
function renderCover(s){
  screen = "cover"; stageIdx = s; qEpoch++;
  clearField();
  var st = STAGES[s], first = (s === 0 && idx === 0);
  var sb = stageBonus; stageBonus = 0;
  coverEl.innerHTML =
    '<div class="tl-card2" style="--tl-title:' + st.color + '">' +
      '<div class="tl-big">' + (first ? "🙃" : st.emoji) + '</div>' +
      '<h2>' + (first ? "Nghiêng đầu chọn đáp án" : "Chặng " + (s + 1) + " · " + st.name) + '</h2>' +
      (first ? '<p class="tl-subt">Nghiêng đầu sang thẻ đúng nhé!</p>' : '') +
      (sb ? '<div class="tl-bonus">🎁 +' + sb + ' ⭐</div>' : '') +
      (first
        ? '<div class="tl-status" id="tl-status"></div>' +
          '<div class="tl-row">' +
            '<button class="tl-go tl-go-big" id="tl-key-go" type="button">⌨ Phím / chạm ▶</button>' +
            '<button class="tl-go tl-go-big tl-alt" id="tl-cam-go" type="button">📷 Camera ▶</button>' +
          '</div>' +
          '<div class="tl-subt tl-small">📷 cần internet</div>'
        : '<button class="tl-go tl-go-big" id="tl-go" type="button">Sẵn sàng ▶</button>') +
    '</div>';
  coverEl.classList.add("tl-on");
  updateMid(); updateBar();
  if(!first){ sfxStage(); }
}
function renderEnd(win){
  screen = "end"; qEpoch++;
  clearField(); AU.stop();
  var perfect = win && missed.length === 0;
  var best = loadBest(), record = false;
  if(score > best){ best = score; record = true; saveBest(score); }
  var stars = win ? Math.max(1, Math.ceil(lives * 3 / MAXLIVES)) : 0;
  var starHtml = "";
  for(var i = 0; i < 3; i++){
    starHtml += i < stars ? '<span class="tl-on-s" style="animation-delay:' + (i * .25) + 's">⭐</span>' : '<span class="tl-off-s">⭐</span>';
  }
  var review = "";
  if(missed.length){
    review = '<div class="tl-review"><div class="tl-review-t">🔊 Nghe lại nhé:</div><div class="tl-chips">';
    var seen = {};
    missed.slice().sort(function(a, b){ return a - b; }).forEach(function(qi){
      var id = Q[qi].w;
      if(seen[id]) return; seen[id] = true;
      review += chipHtml(id);
    });
    review += '</div></div>';
  }
  var head = win
    ? '<div class="tl-stars-row">' + starHtml + '</div><h2>' + (perfect ? "Siêu sao nghiêng đầu! 🌟" : "Nghiêng đầu xuất sắc! 🎉") + '</h2>'
    : '<div class="tl-big">😢</div><h2>Hết tim rồi! Chơi lại nhé! 💪</h2>';
  var meta = '<div class="tl-end-meta">⭐ ' + score + (record ? ' · 🏅 Kỷ lục mới!' : ' · 🏅 ' + best) + '</div>';
  coverEl.innerHTML =
    '<div class="tl-card2">' + head + review +
      '<button class="tl-go tl-go-big" id="tl-again" type="button">🔁 Chơi lại</button>' +
      '<div class="tl-row">' +
        '<button class="tl-go tl-alt tl-go-mini" id="tl-back" type="button" aria-label="Về menu" title="Về menu">🏠</button>' +
      '</div>' + meta +
    '</div>';
  coverEl.classList.add("tl-on");
  updateBar();
  if(win){ sfxWin(); confetti(); } else { sfxLose(); }
}
function confetti(){
  var box = document.createElement("div");
  box.className = "tl-confetti";
  var colors = ["#FF7E94","#ACD9F7","#6CC6AA","#B7A3E3","#FFE27A"];
  var h = "";
  for(var i = 0; i < 56; i++){
    h += '<i style="left:' + (Math.random() * 100).toFixed(1) + '%;background:' + colors[i % colors.length] +
         ';animation-duration:' + (2.4 + Math.random() * 2.2).toFixed(2) + 's;animation-delay:' + (Math.random() * 1.2).toFixed(2) + 's"></i>';
  }
  box.innerHTML = h;
  fieldEl.appendChild(box);
  setTimeout(function(){ if(box.parentNode) box.parentNode.removeChild(box); }, 6500);
}

// ---------- vòng đời game ----------
function resetGame(){
  // mỗi lần vào chơi / chơi lại: bốc và xáo đề mới; nếu trùng y hệt thứ tự ván trước thì bốc lại
  var sig = "", tries = 0;
  do{
    buildQuestions();
    sig = Q.map(function(q){ return q.w + q.dir + (q.s != null ? "s" + q.s : "") + ":" + q.d.join("."); }).join(",");
    tries++;
  } while(sig === resetGame.last && tries < 30);
  resetGame.last = sig;
  epoch++; pending = []; sideLog = []; AU.stop();
  idx = 0; lives = MAXLIVES; score = 0; streak = 0; bestStreak = 0; hits = 0; cleanHits = 0; missed = [];
  heartFx = null; meterFull = false; clearTimeout(meterT); stageBonus = 0; finalBonus = 0;
  paused = false; ov.classList.remove("tl-paused");
  confirmEl.classList.remove("tl-on");
  var old = fieldEl.querySelector(".tl-confetti"); if(old) old.parentNode.removeChild(old);
  timerAcc = 0; timerStart = null;
  renderCover(0);
}
function startGame(){
  if(active) return;
  active = true;
  getCtx();
  ov.classList.add("tl-on");
  resetGame();
}
function exitGame(){
  if(!active) return;
  active = false; paused = false; epoch++; pending = [];
  AU.stop(); stopCamera(); clearTimeout(bannerT); clearTimeout(meterT); tHold();
  confirmEl.classList.remove("tl-on");
  ov.classList.remove("tl-on", "tl-paused");
  var old = fieldEl.querySelector(".tl-confetti"); if(old) old.parentNode.removeChild(old);
  if(window.GM_SHOW){ window.GM_SHOW(); }
}
function openDialog(mode){
  if(!active || paused) return;
  paused = true; AU.stop(); tHold(); clearLean(); holdSide = null;
  ov.classList.add("tl-paused");
  if(mode === "pause"){
    $("tl-d-ico").textContent = "⏸";
    $("tl-d-title").textContent = "Tạm dừng";
  } else {
    $("tl-d-ico").textContent = "🤔";
    $("tl-d-title").textContent = "Chơi tiếp?";
  }
  $("tl-d-sub").textContent = "";
  $("tl-d-continue").textContent = "▶ Chơi tiếp";
  confirmEl.classList.add("tl-on");
}
function closeDialog(){
  if(!paused) return;
  paused = false;
  ov.classList.remove("tl-paused");
  confirmEl.classList.remove("tl-on");
  armed = false;
  var todo = pending; pending = [];
  todo.forEach(function(p){ if(p.e === epoch && active){ p.f(); } });
  if(screen === "q" && qOpen && timerAcc > 0){ tRun(); }
}
function askExit(){
  if(screen === "end" || (screen === "cover" && idx === 0 && stageIdx === 0)){ exitGame(); }
  else { openDialog("exit"); }
}
function listenNow(){
  if(screen !== "q" || !qOpen || paused) return;
  getCtx();
  if(Q[idx].dir === "C"){ banner("Bé đọc câu rồi chọn từ còn thiếu nhé!", 2200); }
  else { AU.play(W[Q[idx].w], null); }
}

// ---------- sự kiện ----------
$("tl-exit").addEventListener("click", askExit);
$("tl-pause").addEventListener("click", function(){ if(screen === "q" || screen === "cover"){ openDialog("pause"); } });
muteBtn.addEventListener("click", function(){
  muted = !muted;
  muteBtn.textContent = muted ? "🔕" : "🔔";
  muteBtn.setAttribute("aria-label", muted ? "Bật âm báo" : "Tắt âm báo");
});
$("tl-listen").addEventListener("click", listenNow);
$("tl-cal").addEventListener("click", function(){ baseAng = rawAng; armed = false; });
$("tl-d-continue").addEventListener("click", closeDialog);
$("tl-d-quit").addEventListener("click", exitGame);
boardEl.addEventListener("pointerdown", function(e){
  var el = e.target.closest ? e.target.closest(".tl-card") : null;
  if(!el) return;
  e.preventDefault();
  choose(el.getAttribute("data-side"));
});
coverEl.addEventListener("click", function(e){
  var t = e.target;
  if(t.closest("#tl-cam-go")){
    getCtx();
    var cb = $("tl-cam-go"), kb = $("tl-key-go");
    cb.disabled = true; kb.disabled = true;
    startCamera().then(function(ok){
      if(!active) return;
      if(ok){ idx = STAGES[stageIdx].from; startQuestion(); }
      else { cb.disabled = false; kb.disabled = false; }
    });
    return;
  }
  if(t.closest("#tl-key-go")){ getCtx(); stopCamera(); updateMid(); idx = STAGES[stageIdx].from; startQuestion(); return; }
  if(t.closest("#tl-go")){ getCtx(); idx = STAGES[stageIdx].from; startQuestion(); return; }
  var chip = t.closest(".tl-chip");
  if(chip){ AU.play(W[+chip.getAttribute("data-w")], null); return; }
  if(t.closest("#tl-again")){ resetGame(); return; }
  if(t.closest("#tl-back")){ exitGame(); return; }
});
window.addEventListener("resize", function(){ if(active){ fitCards(); } });
document.addEventListener("visibilitychange", function(){
  if(active && document.hidden && !paused && (screen === "q" || screen === "cover")){ openDialog("pause"); }
});
document.addEventListener("keydown", function(e){
  if(!active) return;
  if(e.key === "Escape"){
    if(paused){ closeDialog(); } else { askExit(); }
    return;
  }
  if(paused || screen !== "q") return;
  if(e.key === "ArrowLeft" || e.key === "1"){ e.preventDefault(); choose("L"); }
  else if(e.key === "ArrowRight" || e.key === "2"){ e.preventDefault(); choose("R"); }
  else if(e.key === "r" || e.key === "R"){ listenNow(); }
});

window.TL_START = startGame;
window.GD_GAMES.push({ id:"tilt", ico:"🙃", desc:"Nghiêng đầu chọn đáp án", cls:"gm-c3", start:startGame });
})();
</script>

<script>
/* ============================================================
   GAME 4 — CHÉM HOA QUẢ
   - Đề bài ở trên đầu, 3 ô đáp án màu XANH LÁ · ĐỎ · VÀNG. Quả bay lên (🍈 xanh · 🍎 đỏ · 🍋 vàng):
     bé chém quả cùng màu với ô đúng. Chém bằng chuột / ngón tay (kéo qua quả), phím 1 / 2 / 3 = xanh / đỏ / vàng,
     hoặc 📷 camera nhận diện ngón trỏ (MediaPipe Hands, cần internet).
        Kiểu H: cho chữ Hán   → ô có PHIÊN ÂM + NGHĨA
        Kiểu M: cho nghĩa     → ô có CHỮ HÁN + PHIÊN ÂM
        Kiểu C: câu thiếu từ  → ô có TỪ (chữ Hán + phiên âm + nghĩa) điền đúng
   - 4 chặng, 24 câu, 5 tim. Chém nhầm: mất 1 tim, quả bay lại (màu đổi chỗ), bé được chém lại.
   - Điểm: gốc 10/12/15/20 · nhanh ⚡ +2/+5 · combo 🔥 tối đa +10 · câu từng chém nhầm chỉ nửa điểm gốc
           qua chặng +20 +10/tim · hoàn thành +50 (+100 nếu không sai câu nào)
           đúng liên tiếp 5 câu: hồi 1 tim (đủ 5 tim thì thưởng 💎 +30) · kỷ lục lưu trên máy.
============================================================ */
(function(){
"use strict";
var W = window.GD_W, SENT = window.GD_SENT, AU = window.GD_AUDIO;
var MAXLIVES = 5, HEAL_EVERY = 5, BEST_KEY = "gd_fruit_best_" + ((window.GD_CFG && window.GD_CFG.id) || "demo");
var COLORS = ["green", "red", "yellow"];
var EMO = { green:"🍈", red:"🍎", yellow:"🍋" };
var JUICE = { green:"#B8F06E", red:"#FF5A5F", yellow:"#FFE45C" };

var STAGES = [
  { n:6, emoji:"🌱", name:"Khởi động", T:16, base:10, color:"#2F8A6E", mode:"H" },
  { n:6, emoji:"🔎", name:"Tinh mắt",  T:15, base:12, color:"#2E86C1", mode:"M" },
  { n:6, emoji:"✏️", name:"Điền từ",   T:20, base:15, color:"#E8536F", mode:"C" },
  { n:6, emoji:"🏆", name:"Thử thách", T:20, base:20, color:"#6A46B8", mode:"mix" }
];
(function(){   // số câu mỗi chặng: lấy từ GD_CFG.fr_n (nếu có), kẹp theo số từ / số câu có thật
  var cn = (window.GD_CFG && window.GD_CFG.fr_n) || [];
  STAGES.forEach(function(s, i){ if(cn[i] > 0){ s.n = cn[i]; } s.n = Math.min(s.n, s.mode === "C" ? SENT.length : W.length); });
})();
(function(){ var c = 0; STAGES.forEach(function(s){ s.from = c; s.to = c + s.n - 1; c += s.n; }); })();

var $ = function(id){ return document.getElementById(id); };
var ov = $("fr-overlay");
if(!ov){ return; }
var cv = $("fr-canvas"), cx = cv.getContext ? cv.getContext("2d") : null;
var fieldEl = $("fr-field"), hudEl = $("fr-hud"), qBtn = $("fr-q"), fxLayer = $("fr-fx"), bannerEl = $("fr-banner"), coverEl = $("fr-cover"), confirmEl = $("fr-confirm");
var scoreEl = $("fr-score"), comboEl = $("fr-combo"), pipsEl = $("fr-pips"), meterEl = $("fr-meter"), meterTxt = $("fr-meter-txt");
var stageEl = $("fr-stage"), qnumEl = $("fr-qnum"), heartsEl = $("fr-hearts"), muteBtn = $("fr-mute"), modeEl = $("fr-mode");
var boxEl = {}; COLORS.forEach(function(c){ boxEl[c] = $("fr-a-" + c); });
(function(){ var h = ""; for(var i = 0; i < HEAL_EVERY; i++){ h += '<i class="rk-pip"></i>'; } pipsEl.innerHTML = h; })();
var pipEls = pipsEl.querySelectorAll(".rk-pip");

// ---------- trạng thái ----------
var Q = [];
var active = false, muted = false, paused = false;
var screen = "cover";   // cover | q | end
var idx = 0, stageIdx = 0, lives = MAXLIVES, score = 0, streak = 0, bestStreak = 0, hits = 0, cleanHits = 0;
var missed = [];
var qOpen = false, locked = false, probs = false, okCol = "green", colLog = [];
var epoch = 0, qEpoch = 0, bannerT = 0, meterT = 0;
var pending = [];
var heartFx = null, meterFull = false, stageBonus = 0, finalBonus = 0;
var timerAcc = 0, timerStart = null;
// khu chơi (canvas)
var FW = 1, FH = 1, dpr = 1, R = 40, fruits = [], halves = [], parts = [], trail = [], drawing = false, lastPt = null, raf = 0, lastTs = 0, waveT = 0;

function shuffle(a){
  a = a.slice();
  for(var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function stageOf(i){
  for(var s = 0; s < STAGES.length; s++){ if(i >= STAGES[s].from && i <= STAGES[s].to) return s; }
  return STAGES.length - 1;
}
function later(fn, ms){
  var my = epoch;
  setTimeout(function(){
    if(my !== epoch || !active) return;
    if(paused){ pending.push({ e:my, f:fn }); } else { fn(); }
  }, ms);
}
function later2(fn, ms){ setTimeout(fn, ms); }
// đồng hồ tính điểm nhanh (tạm dừng khi bé bấm ⏸)
function tNow(){ return timerAcc + (timerStart !== null ? (performance.now() - timerStart) / 1000 : 0); }
function tRun(){ if(timerStart === null){ timerStart = performance.now(); } }
function tHold(){ if(timerStart !== null){ timerAcc += (performance.now() - timerStart) / 1000; timerStart = null; } }

// ---------- bốc câu hỏi (cùng cách với game sút bóng; mỗi câu chỉ dùng 1 thẻ nhiễu = d[0]) ----------
function allIds(){ return W.map(function(_, i){ return i; }); }
function wordQ(id, dir){
  var others = shuffle(allIds().filter(function(x){ return x !== id && !window.GD_CONFLICT(id, x); }));   // tránh ghép các từ dễ nhầm
  return { w:id, d:others.slice(0, 3), dir:dir };
}
function sentQ(si){ var S = SENT[si]; return { w:S.a, d:S.d.concat(S.e || []), dir:"C", s:si }; }
function pickSent(n, usedS){
  var order = shuffle(SENT.map(function(_, i){ return i; })), picked = [], qn = 0;
  for(var i = 0; i < order.length && picked.length < n; i++){
    if(usedS[order[i]]) continue;
    if(SENT[order[i]].g === "q"){ if(qn >= 2) continue; qn++; }   // tối đa 2 câu cùng nhóm g:"q" mỗi chặng
    picked.push(order[i]); usedS[order[i]] = true;
  }
  return picked;
}
function buildQuestions(){
  Q = [];
  var used = {}, usedS = {};
  function pickWords(n){
    var pool = shuffle(allIds());
    var fresh = pool.filter(function(i){ return !used[i]; });
    var rest = pool.filter(function(i){ return used[i]; });
    var ids = fresh.concat(rest).slice(0, n);
    ids.forEach(function(i){ used[i] = true; });
    return ids;
  }
  STAGES.forEach(function(st){
    if(st.mode === "H" || st.mode === "M"){
      pickWords(st.n).forEach(function(id){ Q.push(wordQ(id, st.mode)); });
    } else if(st.mode === "C"){
      pickSent(st.n, usedS).forEach(function(si){ Q.push(sentQ(si)); });
    } else {   // mix: chia đều H / M / C rồi xáo trộn
      var dirs = [], kinds = ["H","M","C"];
      for(var k = 0; k < st.n; k++){ dirs.push(kinds[k % 3]); }
      dirs = shuffle(dirs);
      var nC0 = dirs.filter(function(d){ return d === "C"; }).length;
      var sents = pickSent(nC0, usedS), short = nC0 - sents.length;
      for(var z = 0; z < dirs.length && short > 0; z++){ if(dirs[z] === "C"){ dirs[z] = "H"; short--; } }   // thiếu câu → đổi sang đề chữ Hán
      var nW = dirs.filter(function(d){ return d !== "C"; }).length;
      var words = pickWords(nW), wi = 0, si = 0;
      dirs.forEach(function(d){
        if(d === "C"){ Q.push(sentQ(sents[si++])); } else { Q.push(wordQ(words[wi++], d)); }
      });
    }
  });
}

var ac = null;
function getCtx(){
  if(!ac){ var C = window.AudioContext || window.webkitAudioContext; if(C){ try{ ac = new C(); }catch(e){} } }
  if(ac && ac.state === "suspended" && ac.resume){ ac.resume(); }
  return ac;
}
function tone(freq, start, dur, type, vol, endFreq){
  if(muted) return;
  var c = getCtx(); if(!c) return;
  var t0 = c.currentTime + start;
  var o = c.createOscillator(), g = c.createGain();
  o.type = type || "sine";
  o.frequency.setValueAtTime(freq, t0);
  if(endFreq){ o.frequency.exponentialRampToValueAtTime(endFreq, t0 + dur); }
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol || 0.2, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

}

// ---------- khu chơi: quả bay, chém ----------
function slowK(){ return window.GD_SLOW ? (window.GD_SLOW_K || 1.8) : 1; }
function measure(){
  FW = Math.max(1, fieldEl.clientWidth); FH = Math.max(1, fieldEl.clientHeight);
  dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(FW * dpr); cv.height = Math.round(FH * dpr);
  if(cx){ cx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  R = Math.max(30, Math.min(72, Math.min(FW, FH) * .085));
}
function rnd(a, b){ return a + Math.random() * (b - a); }
function spawn(){
  var order = shuffle(COLORS), slots = shuffle([0, 1, 2]), sw = FW / 3, K = slowK();
  var hudB = (hudEl.offsetHeight || 100) + 8;
  for(var i = 0; i < 3; i++){
    var x = Math.max(R, Math.min(FW - R, sw * (slots[i] + .5) + rnd(-.18, .18) * sw));
    var top = hudB + R * 1.2 + rnd(0, Math.max(0, (FH - hudB - R * 3) * .3)), y0 = FH + R * 1.3;
    var hh = Math.max(60, y0 - top), tu = rnd(.85, 1.1) * K, dr = rnd(-.14, .14) * FW;
    if(x + dr < R || x + dr > FW - R){ dr = -dr; }
    fruits.push({ c:order[i], x:x, y:y0, vx:dr / (2 * tu), vy:-2 * hh / tu, g:2 * hh / (tu * tu), a:rnd(0, 6.28), w:rnd(-2.6, 2.6), d:i * .22 + rnd(0, .08), dead:false, fade:false, al:1 });
  }

}
function step(dt){
  if(screen === "q" && qOpen && !locked && !fruits.length){ waveT -= dt; if(waveT <= 0){ spawn(); } }
  var i, f;
  for(i = fruits.length - 1; i >= 0; i--){
    f = fruits[i];
    if(f.d > 0){ f.d -= dt; continue; }
    f.vy += f.g * dt; f.x += f.vx * dt; f.y += f.vy * dt; f.a += f.w * dt;
    if(f.fade){ f.al -= dt * 2.6; }
    if(f.al <= 0 || f.dead || (f.y > FH + R * 1.6 && f.vy > 0)){ fruits.splice(i, 1); }
  }
  for(i = halves.length - 1; i >= 0; i--){
    f = halves[i]; f.vy += 1500 * dt; f.x += f.vx * dt; f.y += f.vy * dt; f.sp += f.w * dt; f.al -= dt * .45;
    if(f.y > FH + R * 3 || f.al <= 0){ halves.splice(i, 1); }
  }
  for(i = parts.length - 1; i >= 0; i--){
    f = parts[i]; f.vy += 1100 * dt; f.x += f.vx * dt; f.y += f.vy * dt; f.l -= dt;
    if(f.l <= 0){ parts.splice(i, 1); }
  }
}
function drawFruit(c){
  cx.font = (R * 2) + "px 'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif";
  cx.textAlign = "center"; cx.textBaseline = "middle";
  cx.fillText(EMO[c], 0, R * .08);
}
function draw(ts){
  if(!cx){ return; }
  cx.clearRect(0, 0, FW, FH);
  var i, f;
  for(i = 0; i < fruits.length; i++){
    f = fruits[i]; if(f.d > 0 || f.dead){ continue; }
    cx.save(); cx.globalAlpha = Math.max(0, f.al); cx.translate(f.x, f.y); cx.rotate(f.a); drawFruit(f.c); cx.restore();
  }
  for(i = 0; i < halves.length; i++){
    f = halves[i];
    cx.save(); cx.globalAlpha = Math.max(0, Math.min(1, f.al * 1.6)); cx.translate(f.x, f.y); cx.rotate(f.sp); cx.rotate(f.ang);
    cx.beginPath(); if(f.side < 0){ cx.rect(-R * 3, -R * 3, R * 6, R * 3); } else { cx.rect(-R * 3, 0, R * 6, R * 3); } cx.clip();
    cx.rotate(f.a0 - f.ang); drawFruit(f.c); cx.restore();
  }
  for(i = 0; i < parts.length; i++){
    f = parts[i];
    cx.save(); cx.globalAlpha = Math.max(0, f.l / .9); cx.fillStyle = f.col; cx.beginPath(); cx.arc(f.x, f.y, f.s, 0, 6.283); cx.fill(); cx.restore();
  }
  trail = trail.filter(function(p){ return ts - p.t < 260; });
  cx.save(); cx.lineCap = "round";
  for(i = 1; i < trail.length; i++){
    var a = trail[i - 1], b = trail[i]; if(b.s){ continue; }
    var ag = Math.min(1, (ts - b.t) / 260), w = (1 - ag) * 13 + 2;
    cx.strokeStyle = "rgba(255,255,255," + (.95 * (1 - ag)).toFixed(3) + ")"; cx.lineWidth = w;
    cx.beginPath(); cx.moveTo(a.x, a.y); cx.lineTo(b.x, b.y); cx.stroke();
  }
  if(camOn && sm){
    cx.fillStyle = "rgba(255,255,255,.95)"; cx.shadowColor = "#4DA3FF"; cx.shadowBlur = 18;
    cx.beginPath(); cx.arc(sm.x, sm.y, 9, 0, 6.283); cx.fill();
  }

}
function loop(ts){

}
function clearPlay(){ fruits = []; halves = []; parts = []; trail = []; lastPt = null; }
// đoạn thẳng của đường chém cắt hình tròn của quả
function stroke(x, y, fresh){
  if(paused || !active){ return; }
  var t = performance.now();
  if(fresh || !lastPt){ lastPt = { x:x, y:y }; trail.push({ x:x, y:y, t:t, s:true }); return; }
  trail.push({ x:x, y:y, t:t, s:false });

}
function seg(x0, y0, x1, y1){
  if(locked || !qOpen || paused || screen !== "q"){ return; }
  var dx = x1 - x0, dy = y1 - y0, l2 = dx * dx + dy * dy;
  if(l2 < 4){ return; }   // đứng yên: không tính là chém
  var best = null, bt2 = 2;
  for(var i = 0; i < fruits.length; i++){
    var f = fruits[i]; if(f.dead || f.fade || f.d > 0){ continue; }
    var t = Math.max(0, Math.min(1, ((f.x - x0) * dx + (f.y - y0) * dy) / l2));
    if(Math.hypot(f.x - (x0 + dx * t), f.y - (y0 + dy * t)) <= R * .95 && t < bt2){ bt2 = t; best = f; }
  }
  if(best){ slice(best, Math.atan2(dy, dx)); }
}
function slice(f, ang){
  if(locked || screen !== "q" || !qOpen || paused){ return; }

  f.dead = true;
  var col = f.c, nx = -Math.sin(ang), ny = Math.cos(ang);
  [-1, 1].forEach(function(sd){
    halves.push({ c:col, x:f.x, y:f.y, vx:(f.vx || 0) * .5 + nx * sd * rnd(110, 170), vy:(f.vy || 0) * .4 + ny * sd * rnd(110, 170) - 60, sp:0, w:sd * rnd(.8, 2.2), a0:f.a || 0, ang:ang, side:sd, al:1 });
  });
  for(var i = 0; i < 26; i++){
    var an = Math.random() * 6.283, sp = rnd(120, 420);
    parts.push({ x:f.x, y:f.y, vx:Math.cos(an) * sp, vy:Math.sin(an) * sp - 90, s:rnd(2.5, 7), col:JUICE[col], l:rnd(.5, .9) });
  }
  fruits.forEach(function(o){ if(o !== f){ o.fade = true; } });
  if(col === okCol){
    var ratio = Math.min(1, tNow() / (STAGES[stageIdx].T * slowK()));
    tHold(); qOpen = false;
    onGood(col, f.x, f.y, ratio);
  } else {

  }

function sliceColor(col){   // phím 1 / 2 / 3

  var f = null;

    if(fruits[i].c === col && !fruits[i].dead && !fruits[i].fade && fruits[i].d <= 0 && fruits[i].y < FH){ f = fruits[i]; break; }
  }
  if(!f){ f = { c:col, x:FW / 2, y:FH * .6, vx:0, vy:0, a:0 }; }

    : '<div class="rk-big">😢</div><h2>Hết tim rồi! Chơi lại nhé! 💪</h2>';
  var meta = '<div class="rk-end-meta">⭐ ' + score + (record ? ' · 🏅 Kỷ lục mới!' : ' · 🏅 ' + best) + '</div>';
  coverEl.innerHTML =
    '<div class="rk-card">' + head + review +
      '<button class="rk-go rk-go-big" id="fr-again" type="button">🔁 Chơi lại</button>' +
      '<div class="rk-row">' +
        '<button class="rk-go rk-alt rk-go-mini" id="fr-back" type="button" aria-label="Về menu" title="Về menu">🏠</button>' +
      '</div>' + meta +
    '</div>';
  coverEl.classList.add("rk-on");
  updateBar();
  if(win){ sfxWin(); confetti(); } else { sfxLose(); }
}
function confetti(){
  var box = document.createElement("div");
  box.className = "rk-confetti";
  var colors = ["#FF7E94", "#ACD9F7", "#6CC6AA", "#B7A3E3", "#FFE27A"];
  var h = "";
  for(var i = 0; i < 56; i++){
    h += '<i style="left:' + (Math.random() * 100).toFixed(1) + '%;background:' + colors[i % colors.length] +
         ';animation-duration:' + (2.4 + Math.random() * 2.2).toFixed(2) + 's;animation-delay:' + (Math.random() * 1.2).toFixed(2) + 's"></i>';
  }
  box.innerHTML = h;
  fieldEl.appendChild(box);
  setTimeout(function(){ if(box.parentNode){ box.parentNode.removeChild(box); } }, 6500);
}

// ---------- camera nhận diện ngón trỏ (MediaPipe Hands, cần internet) ----------
var vid = $("fr-video"), camBtn = $("fr-cam"), camOn = false, camBusy = false, stream = null, hl = null, lastDet = 0, camMiss = 0, sm = null;
function wt(p, ms){
  return new Promise(function(res, rej){
    var t = setTimeout(function(){ rej(new Error("timeout")); }, ms);
    p.then(function(v){ clearTimeout(t); res(v); }, function(e){ clearTimeout(t); rej(e); });
  });
}
function setMode(){
  modeEl.textContent = camOn ? "📷 Vung ngón trỏ qua quả" : "🖱 Kéo qua quả · phím 1 2 3";
  camBtn.classList.toggle("on", camOn);
  fieldEl.classList.toggle("fr-cam-on", camOn);
}
function stopCam(){
  camOn = false;
  if(stream){ try{ stream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){} stream = null; }
  if(hl){ try{ hl.close(); }catch(e){} hl = null; }
  try{ vid.srcObject = null; }catch(e){}
  sm = null; camMiss = 0; lastPt = null; setMode();
}
function status(t){
  var e = $("fr-status");
  if(e){ e.textContent = t; } else if(t){ banner(t, 4500); }
}
async function startCam(){
  if(camOn && hl && stream){ return true; }
  if(camBusy){ return false; }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ status("⚠ Máy này không mở được camera. Bé chơi bằng chuột / chạm nhé."); return false; }
  camBusy = true; camBtn.disabled = true; status("⏳ Đang mở camera...");
  try{ stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:"user", width:{ ideal:640 }, height:{ ideal:480 } }, audio:false }); }
  catch(e){ camBusy = false; camBtn.disabled = false; stream = null; status("⚠ Không mở được camera (" + ((e && e.name) || "lỗi") + "). Bé chơi bằng chuột / chạm nhé."); return false; }
  status("⏳ Đang tải bộ nhận diện bàn tay (cần internet)...");
  try{
    var base = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
    var vis = await wt(import(base + "/vision_bundle.mjs"), 25000), fs = await wt(vis.FilesetResolver.forVisionTasks(base + "/wasm"), 25000);
    var op = function(d){ return { baseOptions:{ modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task", delegate:d }, runningMode:"VIDEO", numHands:1 }; };
    try{ hl = await wt(vis.HandLandmarker.createFromOptions(fs, op("GPU")), 30000); }catch(e1){ hl = await wt(vis.HandLandmarker.createFromOptions(fs, op("CPU")), 30000); }
  }catch(e2){ camBusy = false; camBtn.disabled = false; stopCam(); status("⚠ Không tải được bộ nhận diện bàn tay (kiểm tra internet). Bé chơi bằng chuột / chạm nhé."); return false; }
  camBusy = false; camBtn.disabled = false;
  if(!active){ stopCam(); return false; }
  camOn = true; sm = null; camMiss = 0; lastDet = 0;
  vid.srcObject = stream; var pp = vid.play(); if(pp && pp.catch){ pp.catch(function(){}); }
  lastPt = null; setMode(); status("");
  return true;
}
function camTick(ts){
  if(!camOn || !hl || ts - lastDet < 40 || vid.readyState < 2 || !vid.videoWidth){ return; }
  lastDet = ts;
  var r = null; try{ r = hl.detectForVideo(vid, ts); }catch(e){ return; }
  var pt = r && r.landmarks && r.landmarks[0];
  if(!pt){ camMiss++; if(camMiss >= 3){ sm = null; lastPt = null; } return; }   // mất dấu tay: xoá điểm cũ
  camMiss = 0;
  var tip = pt[8], vw = vid.videoWidth, vh = vid.videoHeight, sc = Math.max(FW / vw, FH / vh), dw = vw * sc, dh = vh * sc;
  var px = (FW - dw) / 2 + (1 - tip.x) * dw, py = (FH - dh) / 2 + tip.y * dh, fresh = false;   // video hiển thị lật gương
  if(!sm){ sm = { x:px, y:py }; fresh = true; }
  else if(Math.hypot(px - sm.x, py - sm.y) > Math.min(FW, FH) * .6){ sm = { x:px, y:py }; fresh = true; }
  else { sm.x += (px - sm.x) * .6; sm.y += (py - sm.y) * .6; }
  stroke(sm.x, sm.y, fresh);
}

// ---------- vòng đời game ----------
function resetGame(){
  // mỗi lần vào chơi / chơi lại: bốc và xáo đề mới; nếu trùng y hệt thứ tự ván trước thì bốc lại
  var sig = "", tries = 0;
  do{
    buildQuestions();
    sig = Q.map(function(q){ return q.w + q.dir + (q.s != null ? "s" + q.s : "") + ":" + q.d.join("."); }).join(",");
    tries++;
  } while(sig === resetGame.last && tries < 30);
  resetGame.last = sig;
  epoch++; pending = []; colLog = []; AU.stop();
  idx = 0; lives = MAXLIVES; score = 0; streak = 0; bestStreak = 0; hits = 0; cleanHits = 0; missed = [];
  heartFx = null; meterFull = false; clearTimeout(meterT); stageBonus = 0; finalBonus = 0;
  paused = false; confirmEl.classList.remove("rk-on");
  timerAcc = 0; timerStart = null;
  COLORS.forEach(function(c){ boxEl[c].innerHTML = ""; boxEl[c].className = "fr-ans fr-" + c; });
  qBtn.innerHTML = "";
  renderCover(0);
}
function startGame(){
  if(active){ return; }
  active = true;
  getCtx();
  ov.classList.add("rk-on");
  measure();
  resetGame();
  setTimeout(function(){ if(active){ measure(); } }, 600);
  lastTs = performance.now();
  if(!raf){ raf = requestAnimationFrame(loop); }
}
function exitGame(){
  if(!active){ return; }
  active = false; paused = false; epoch++; pending = [];
  AU.stop(); stopCam(); clearTimeout(bannerT); clearTimeout(meterT); tHold();
  clearPlay(); drawing = false;
  confirmEl.classList.remove("rk-on");
  ov.classList.remove("rk-on");
  var old = fieldEl.querySelector(".rk-confetti"); if(old){ old.parentNode.removeChild(old); }
  if(window.GM_SHOW){ window.GM_SHOW(); }
}
function openDialog(mode){
  if(!active || paused){ return; }
  paused = true; AU.stop(); tHold(); trail = []; lastPt = null; drawing = false;
  var p = mode === "pause";
  $("fr-d-ico").textContent = p ? "⏸" : "🤔";
  $("fr-d-title").textContent = p ? "Tạm dừng" : "Chơi tiếp?";
  $("fr-d-sub").textContent = "";
  $("fr-d-continue").textContent = "▶ Chơi tiếp";
  confirmEl.classList.add("rk-on");
}
function closeDialog(){
  if(!paused){ return; }
  paused = false;
  confirmEl.classList.remove("rk-on");
  lastTs = performance.now();
  var todo = pending; pending = [];
  todo.forEach(function(p){ if(p.e === epoch && active){ p.f(); } });
  if(screen === "q" && qOpen && fruits.length){ tRun(); }
}
function askExit(){
  if(screen === "end" || (screen === "cover" && idx === 0 && stageIdx === 0)){ exitGame(); }
  else { openDialog("exit"); }
}
function listenNow(){
  if(screen !== "q" || !qOpen || paused){ return; }
  getCtx();
  if(Q[idx].dir === "C"){ banner("Bé đọc câu rồi chém từ còn thiếu nhé!", 2200); }
  else { AU.play(W[Q[idx].w], null); }
}

// ---------- sự kiện ----------
$("fr-exit").addEventListener("click", askExit);
$("fr-pause").addEventListener("click", function(){ if(screen === "q" || screen === "cover"){ openDialog("pause"); } });
muteBtn.addEventListener("click", function(){ muted = !muted; this.textContent = muted ? "🔕" : "🔔"; });
camBtn.addEventListener("click", function(){
  if(camBusy){ return; }
  if(camOn){ stopCam(); banner("Đã tắt camera", 2000); }
  else { getCtx(); startCam().then(function(ok){ if(ok){ banner("📷 Vung ngón trỏ qua quả!", 2500); } }); }
});
$("fr-listen").addEventListener("click", listenNow);
qBtn.addEventListener("click", listenNow);
$("fr-d-continue").addEventListener("click", closeDialog);
$("fr-d-quit").addEventListener("click", exitGame);
coverEl.addEventListener("click", function(e){
  var t = e.target;
  if(t.closest("#fr-cam-go")){
    getCtx();
    var cb = $("fr-cam-go"), mb = $("fr-mouse-go"); cb.disabled = true; mb.disabled = true;
    startCam().then(function(ok){
      if(!active){ return; }
      if(ok){ idx = STAGES[stageIdx].from; startQuestion(); }
      else { var c2 = $("fr-cam-go"), m2 = $("fr-mouse-go"); if(c2){ c2.disabled = false; } if(m2){ m2.disabled = false; } }
    });
    return;
  }
  if(t.closest("#fr-mouse-go")){ getCtx(); stopCam(); idx = STAGES[stageIdx].from; startQuestion(); return; }
  if(t.closest("#fr-go")){ getCtx(); idx = STAGES[stageIdx].from; startQuestion(); return; }
  var ch = t.closest(".rk-chip");
  if(ch){ AU.play(W[+ch.getAttribute("data-w")], null); return; }
  if(t.closest("#fr-again")){ resetGame(); return; }
  if(t.closest("#fr-back")){ exitGame(); }
});
function lpt(e){ var r = fieldEl.getBoundingClientRect(); return { x:e.clientX - r.left, y:e.clientY - r.top }; }
fieldEl.addEventListener("pointerdown", function(e){
  if(!active || paused || screen !== "q"){ return; }
  if(e.target.closest && e.target.closest(".fr-q,.rk-cover,.rk-confirm,button")){ return; }
  if(e.pointerType === "mouse" && e.button !== 0){ return; }
  e.preventDefault(); drawing = true;
  try{ fieldEl.setPointerCapture(e.pointerId); }catch(x){}
  var p = lpt(e); lastPt = null; stroke(p.x, p.y, true);
});
fieldEl.addEventListener("pointermove", function(e){
  if(!drawing || !active || paused){ return; }
  e.preventDefault();
  var l = (e.getCoalescedEvents && e.getCoalescedEvents().length) ? e.getCoalescedEvents() : [e];
  for(var i = 0; i < l.length; i++){ var p = lpt(l[i]); stroke(p.x, p.y, false); }
});
function endDraw(){ drawing = false; lastPt = null; }
fieldEl.addEventListener("pointerup", endDraw);
fieldEl.addEventListener("pointercancel", endDraw);
fieldEl.addEventListener("contextmenu", function(e){ e.preventDefault(); });
window.addEventListener("resize", function(){ if(active){ measure(); } });
if(window.ResizeObserver){ new ResizeObserver(function(){ if(active){ measure(); } }).observe(fieldEl); }
document.addEventListener("visibilitychange", function(){ if(document.hidden && active && !paused && (screen === "q" || screen === "cover")){ openDialog("pause"); } });
document.addEventListener("keydown", function(e){
  if(!active){ return; }
  if(e.key === "Escape"){
    if(paused){ closeDialog(); } else { askExit(); }
    return;
  }
  if(e.key === "p" || e.key === "P"){
    if(paused){ closeDialog(); } else if(screen === "q" || screen === "cover"){ openDialog("pause"); }
    return;
  }
  if(paused || screen !== "q"){ return; }
  if(e.key === "1"){ sliceColor("green"); }
  else if(e.key === "2"){ sliceColor("red"); }
  else if(e.key === "3"){ sliceColor("yellow"); }
  else if(e.key === "r" || e.key === "R"){ listenNow(); }
});

window.FR_START = startGame;
window.GD_GAMES.push({ id:"fruit", ico:"🍉", desc:"Chém hoa quả", cls:"gm-c4", start:startGame });
})();
</script>

<script>
/* MENU CHỌN GAME — mỗi game đăng ký vào window.GD_GAMES, và gọi window.GM_SHOW() khi bé thoát về menu */
(function(){
"use strict";
var CFG = window.GD_CFG || {}, W = window.GD_W || [];
var menu = document.getElementById("gm-overlay");
window.GM_SHOW = function(){ menu.classList.add("gm-on"); };
var mp = document.getElementById("mp-overlay"), mpCards = document.getElementById("mp-cards");
window.MP_SHOW = function(){ mp.classList.add("gm-on"); };

// tên bài
var zhEl = document.getElementById("gm-zh");
zhEl.textContent = CFG.title_zh || "";
if(!CFG.title_zh){ zhEl.style.display = "none"; }
else { document.title = "🎮 Game ôn từ · " + CFG.title_zh; }

// map của game tên lửa
window.RK_THEMES.forEach(function(t){
  var b = document.createElement("button");
  b.type = "button"; b.className = "gm-card";
  b.style.setProperty("--gm-bg", t.bg); b.style.setProperty("--gm-bd", t.bd);
  b.innerHTML = '<span class="gm-ico">' + t.ico + '</span><span class="gm-name">' + t.name + '</span><span class="gm-desc">Bắn bằng ' + t.noun + '</span>';
  b.addEventListener("click", function(){ window.RK_THEME = t.id; mp.classList.remove("gm-on"); if(window.RK_START){ window.RK_START(); } });
  mpCards.appendChild(b);
});
document.getElementById("mp-back").addEventListener("click", function(){ mp.classList.remove("gm-on"); menu.classList.add("gm-on"); });

// Bấm vào game → tự vào chế độ toàn màn hình (máy nào không hỗ trợ, ví dụ iPhone, thì bỏ qua, game vẫn chạy bình thường)
function goFullscreen(){
  try{
    var el = document.documentElement;
    if(document.fullscreenElement || document.webkitFullscreenElement){ return; }
    var f = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if(f){ var r = f.call(el); if(r && r.catch){ r.catch(function(){}); } }
  }catch(e){}
}
// thẻ game: lấy từ window.GD_GAMES, lọc theo CFG.games (nếu có)
var cardsEl = document.getElementById("gm-cards"), n = 0;
(window.GD_GAMES || []).forEach(function(g){
  if(CFG.games && CFG.games.indexOf(g.id) < 0) return;
  n++;
  var b = document.createElement("button");
  b.type = "button"; b.className = "gm-card " + (g.cls || "gm-c1");
  b.innerHTML = '<span class="gm-ico">' + g.ico + '</span><span class="gm-name">Game ' + n + '</span><span class="gm-desc">' + g.desc + '</span>';
  b.addEventListener("click", function(){ goFullscreen(); menu.classList.remove("gm-on"); g.start(); });
  cardsEl.appendChild(b);
});

// Rơi chậm (chỉ game tên lửa): bật/tắt ở màn chọn map, nhớ lựa chọn trên máy
var slowBtn = document.getElementById("gm-slow"), slowOn = false;
try{ slowOn = localStorage.getItem("gd_slow") === "1"; }catch(e){}
var paintSlow = function(){
  window.GD_SLOW = slowOn;
  slowBtn.classList.toggle("on", slowOn);
  slowBtn.setAttribute("aria-pressed", slowOn ? "true" : "false");
};
paintSlow();
slowBtn.addEventListener("click", function(){
  slowOn = !slowOn; paintSlow();
  try{ localStorage.setItem("gd_slow", slowOn ? "1" : "0"); }catch(e){}
});
})();
</script>
